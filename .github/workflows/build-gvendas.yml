name: Build Gvendas Automático

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Dispara o workflow quando você faz push de uma tag que começa com "v" (ex: v1.0.0)
    paths:
      - 'apps/gvendas/**'  # Monitora mudanças no Dockerfile e config do Nginx
      - 'repos/gvendas/**' # Monitora mudanças no código-fonte do app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # O PAT é obrigatório aqui para o Git conseguir ler seus submodules privados
          token: ${{ secrets.MY_PAT }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # O GITHUB_TOKEN é suficiente e seguro para publicar a imagem no seu repositório
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          # O contexto é a raiz (.) para que o Docker enxergue o monorepo inteiro
          context: .
          # Caminho do Dockerfile dentro da pasta apps
          file: ./apps/gvendas/Dockerfile
          push: true
          # Gera a tag com o SHA, a 'latest', e se for uma tag Git, também gera a tag de versão
          tags: |
            ghcr.io/${{ github.repository }}/gvendas:${{ github.sha }}
            ghcr.io/${{ github.repository }}/gvendas:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/gvendas:{1}', github.repository, github.ref_name) || '' }}
