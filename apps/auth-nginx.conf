# --- LÓGICA DE VALIDAÇÃO GLOBAL ---

location = /validar-usuario {
    internal;
    
    # Teste de ausência de credenciais (Header e URL)
    set $test_token "";
    if ($http_authorization = "") { set $test_token "A"; }
    if ($arg_token = "") { set $test_token "${test_token}B"; }
    
    # Se não tem nada, retorna 401 para disparar o prompt
    if ($test_token = "AB") {
        return 401;
    }

    set $auth_header $http_authorization;
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    resolver 127.0.0.11 valid=30s;
    set $upstream_django http://django:8000;
    
    proxy_pass $upstream_django/api/user/;
    proxy_set_header Host "sgn-django"; 
    proxy_set_header Authorization $auth_header;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    proxy_intercept_errors off; 
}

location = /validar-empresa {
    internal;
    # Endereço do DNS interno do Docker
    resolver 127.0.0.11 valid=30s;
    set $upstream_django http://django:8000;
    
    proxy_pass $upstream_django/api/site/$host/;
    proxy_set_header Host "sgn-django";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 =404 /404.html;
}

# Bloco que realmente abre o prompt no navegador
location @prompt_auth {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 401 "Autenticacao Necessaria";
}
