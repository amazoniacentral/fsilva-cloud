services:
  cliente:
    image: ghcr.io/amazoniacentral/cliente/cliente:v1.0.8
    restart: always
    hostname: cliente
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    networks:
      - default
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

networks:
  default:
