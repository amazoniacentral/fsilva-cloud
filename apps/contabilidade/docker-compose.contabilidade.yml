services:
  # CDN - Arquivos Públicos
  contabilidade:
    image: ghcr.io/amazoniacentral/contabilidade/contabilidade:v1.0.1
    # container_name: media
    restart: always
    hostname: contabilidade
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      #- ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/storage/media_files:ro
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
