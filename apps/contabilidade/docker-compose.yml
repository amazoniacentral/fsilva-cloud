services:
  contabilidade:
    image: ghcr.io/amazoniacentral/contabilidade/contabilidade:v1.0.1
    restart: always
    hostname: contabilidade
    volumes:
      - media_data:/app/storage/media_files:ro
    working_dir: /app
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

networks:
  default:

volumes:
  media_data:
