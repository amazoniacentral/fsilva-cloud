services:
  gvendas:
    image: ghcr.io/amazoniacentral/gvendas/gvendas:v1.1.49
    restart: always
    hostname: gvendas
    working_dir: /usr/share/nginx/app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - META_APP_ID=${META_APP_ID}
      - CONFIG_ID=${CONFIG_ID}
      
    volumes:
      - gvendas_data:/usr/share/nginx/app
      - certificados_data:/usr/share/nginx/.well-known:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
      
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
