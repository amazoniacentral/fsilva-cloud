services:
  gvendas:
    # 1. Substituímos o 'build' pela sua imagem no GHCR
    image: ghcr.io/amazoniacentral/fsilva-cloud/gvendas:v1.0.4 
    #v1.0.1
    #latest
    
    restart: always
    hostname: gvendas
    working_dir: /usr/share/nginx/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    
    # 2. Estas variáveis de ambiente são lidas pelo 'envsubst' no momento em que o container sobe
    # Certifique-se de que elas estejam definidas no seu arquivo .env ou no seu SO
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - META_APP_ID=${META_APP_ID}
      - CONFIG_ID=${CONFIG_ID}
      
    volumes:
      - gvendas_data:/usr/share/nginx/html
      - certificados_data:/usr/share/nginx/.well-known:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
