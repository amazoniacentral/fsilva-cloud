services:
  gvendas:
    build: 
      context: ../../
      dockerfile: ./apps/gvendas/Dockerfile
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
        - REACT_APP_META_APP_ID=${META_APP_ID}
        - REACT_APP_CONFIG_ID=${CONFIG_ID}
    restart: always
    hostname: gvendas
    working_dir: /usr/share/nginx/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gvendas_data:/usr/share/nginx/html
      - certificados_data:/usr/share/nginx/.well-known:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
    depends_on:
      django:
        condition: service_healthy