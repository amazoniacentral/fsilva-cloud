services:
  # CDN - Arquivos Públicos
  media:
    image: nginx:alpine
    # container_name: media
    restart: always
    hostname: media
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - media_data:/app/storage/media_files:ro
      - catalogos_json_data:/app/storage/json:ro
      - catalogos_pdf_compress_data:/app/storage/compress:ro
    working_dir: /app/storage
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
