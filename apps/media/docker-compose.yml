services:
  media:
    image: nginx:alpine
    restart: always
    hostname: media
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - media_data:/app/storage/media_files:ro
      - catalogos_json_data:/app/storage/json:ro
      - catalogos_pdf_compress_data:/app/storage/compress:ro
    working_dir: /app/storage
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

networks:
  default:

volumes:
  media_data:
    external: true
  catalogos_json_data:
    external: true
  catalogos_pdf_compress_data:
    external: true
