server {
    listen 80;
    server_name localhost;
    
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log debug;
    
    # Otimizações globais de entrega de arquivos do Kernel para a Rede
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 1. Rota das Mídias Direto na Raiz (/) - Mantém 1 ano de cache imutável
    location ~* ^/([^/]+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|csv|xml|xlsx|pdf|zip|json))$ {
        alias /app/storage/media_files/$1;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        try_files "" =404;
    }

    # 2. Rota para os Catálogos JSON e PDFs Compactados - Configurado para 30 dias de cache
    location ~* ^/(json|compress)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|csv|xml|xlsx|pdf|zip|json)$ {
        root /app/storage/;

        # Configura o tempo de expiração do Nginx para 30 dias
        expires 30d;
        
        # Define max-age para 2592000 segundos (30 dias). 
        # Removido o parâmetro 'immutable' para permitir revalidação se o arquivo mudar antes de 30 dias.
        add_header Cache-Control "public, max-age=2592000, no-transform" always;
        
        # Permissões e Segurança
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Busca o arquivo físico localmente no disco
        try_files $uri =404;
    }
}
