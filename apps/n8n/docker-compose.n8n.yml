services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=smtp.gmail.com
      - N8N_SMTP_PORT=587
      - N8N_SMTP_USER=franciscosilva.executivo@gmail.com
      - N8N_SMTP_PASS=izknqjrslohzjwze
      - N8N_SMTP_SENDER=N8N <no-reply@gvendas.app.br>
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_ENCRYPTION_KEY=8935f4803dfbf1ec12c28d283a736d43cb6eef07b4138c143115e1db5239adc6
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${COMPOSE_PROJECT_NAME}-postgres-1
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - DB_POSTGRESDB_SCHEMA=public
    
    networks:
      - net_n8n
      - net_db
      - net_web_only
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 100M
    expose:
      - "5678"
    working_dir: /home/node
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_docs_data:/home/node/.n8n-files
    depends_on:
      postgres:
        condition: service_healthy
