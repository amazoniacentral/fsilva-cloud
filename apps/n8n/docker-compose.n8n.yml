services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 100M

    volumes:
      - n8n_data:/home/node/.n8n