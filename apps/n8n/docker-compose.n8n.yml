services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped

    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
    
    networks:
      - net_n8n
      - net_web_only
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.10'
          memory: 100M
    expose:
      - "5678"

    volumes:
      - n8n_data:/home/node/.n8n