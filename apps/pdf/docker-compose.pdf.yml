services:
  pdf-service:
    build: ./
    restart: always
    expose:
      - "3000"
    networks:
      - default
      - net_n8n
    working_dir: /home/node
    volumes:
      - pdf_docs_data:/home/node/src/output
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 100M

networks:
  default:
  net_n8n:
    external: true

volumes:
  pdf_docs_data:
