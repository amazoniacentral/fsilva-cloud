
services:
  pdf-service:
    build: ./
    restart: always
    expose:
      - "3000"
    networks:
      - net_n8n
      - net_web_only
    working_dir: /home/node
    volumes:
      - pdf_docs_data:/home/node/src/output
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 100M