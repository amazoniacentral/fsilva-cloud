<style>
  /* Estilização isolada do cabeçalho da primeira página */
  .first-page-header {
    margin-top: -40px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-family: Arial, sans-serif;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .big-logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .company-info h1 {
    margin: 0 0 5px 0;
    font-size: 22px;
    color: #111;
  }

  .company-info p {
    margin: 2px 0;
    font-size: 11px;
    color: #666;
  }

  .header-right {
    text-align: right;
    font-size: 11px;
    color: #444;
    line-height: 1.5;
  }

  .header-right .doc-title {
    font-size: 14px;
    font-weight: bold;
    color: #222;
    margin-bottom: 5px;
  }
</style>

<div class="first-page-header">
  <div class="header-left">
    {{#if logo}}
      <img src="{{logo}}" class="big-logo" alt="Logo" />
    {{/if}}
    <div class="company-info">
      <h1>{{company}}</h1>
      <p>Documento Oficial de Movimentações</p>
    </div>
  </div>
  <div class="header-right">
    <div class="doc-title">{{title}}</div>
    <div><strong>Período:</strong> {{periodo}}</div>
  </div>
</div>
