<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  color: #333;
}

.content { padding: 5px 30px 5px 30px; }

h1 { margin-bottom: 20px; }

.day {
  border: 1px solid #ddd;
  margin-bottom: 20px;
  border-radius: 6px;
  overflow: hidden;
}

.header {
  background: #f5f5f5;
  padding: 5px 15px;
  font-weight: bold;
  font-size: 14px;
}

.summary {
  display: flex;
  gap: 20px;
  padding: 5px 15px;
  font-size: 12px;
  border-bottom: 1px solid #eee;
}

.entrada { color: green; font-weight: bold; }
.saida { color: red; font-weight: bold; }
.total { color: #000; font-weight: bold; }

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #fafafa;
  padding: 5px;
  text-align: left;
  font-size: 12px;
}

td {
  padding: 3px;
  border-top: 1px solid #eee;
  font-size: 10px;
}
</style>

</head>

<body>

<div class="content">
  
  {{> meuCabecalhoGrande}}
  
  {{#data}}
    
    <div class="day">
      <div class="header">
        📅 {{periodo}}
      </div>
  
      <div class="summary">
        <div>
          Entradas:<br>
          <span class="entrada">R$ {{money entradas}}</span>
        </div>
  
        <div>
          Saídas:<br>
          <span class="saida">R$ {{money saidas}}</span>
        </div>
  
        <div>
          Saldo:<br>
          <span class="total">R$ {{money total}}</span>
        </div>
      </div>
    </div>
    
    <div>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Origem</th>
            <th>Valor</th>
          </tr>
        </thead>
  
        <tbody>
          {{#each lancamentos}}
          <tr>
            <td>{{date data}}</td>
            <td>{{tipo}}</td>
            <td>{{descricao}}</td>
            <td>{{origem}}</td>
            <td>R$ {{money valor}}</td>
          </tr>
          {{/each}}
        </tbody>
      </table>
    </div>
    
  {{/data}}

</div>

</body>
</html>
