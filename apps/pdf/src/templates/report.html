<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial;
  padding: 0; /* importante */
  margin: 0;
  color: #333;
}

/* espaço interno do conteúdo */
.content {
  padding: 40px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th {
  background: #f5f5f5;
  padding: 10px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<div class="content">

  <div style="margin-bottom: 20px;">
    <h2>{{title}}</h2>
    <p>Cliente: {{client}}</p>
  </div>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Qtd</th>
        <th>Valor</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody>
      {{#each items}}
      <tr>
        <td>{{name}}</td>
        <td>{{qty}}</td>
        <td>{{price}}</td>
        <td>{{total}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>

</div>

</body>
</html>
