services:
  sftp-service:
    image: atmoz/sftp:latest
    restart: always
    expose:
      - "22"
    networks:
      - default
      - net_n8n
    env_file:
      - .env
    environment:
      - SFTP_USERS=${SFTP_USER:-admin}:${SFTP_PASSWORD:-admin}:::${SFTP_PATH:-upload}
    volumes:
      - pdf_docs_data:/home/admin/upload/documentos
      - catalogos_pdf_compress_data:/home/admin/upload/catalogos:ro
    working_dir: /home
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 100M

networks:
  default:
  net_n8n:
    external: true

volumes:
  pdf_docs_data:
    external: true
  catalogos_pdf_compress_data:
    external: true
