services:
  # NGINX - Porta de entrada
  nginx:
    image: nginx:alpine
    restart: always
    hostname: static-server
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - sgn_data:/code/staticfiles:ro
    working_dir: /volumes
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    depends_on:
      django:
        condition: service_healthy

  # APP PRINCIPAL (Django)
  django:
    build: 
      context: ../../
      dockerfile: ./apps/sgn/Dockerfile
    env_file:
      - .env 
    restart: always
    hostname: api
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    command: >
      sh -c "python manage.py migrate --noinput && 
             python manage.py collectstatic --noinput && 
             python manage.py gerar_sites_html && 
             gunicorn sgn.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gevent --worker-connections 1000 --timeout 120 --max-requests 500 --max-requests-jitter 50 --keep-alive 2"
    volumes:
      - ../../repos/sgn:/code
      - sgn_data:/code/staticfiles
      - media_data:/code/volumes/media
      - catalogos_pdf_data:/code/volumes/catalogo/pdf
      - catalogos_json_data:/code/volumes/catalogo/json
      - gvendas_data:/code/volumes/html
      - storage_data:/code/volumes/private
      - certificados_data:/code/volumes/certificados
      - traefik_dynamics:/code/volumes/dynamic
      - backups:/code/volumes/backups
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_db
      - net_boot
      - net_web_only
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 8000))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Dá 30 segundos para as migrações rodarem
  
  # WORKER
  celery-worker:
    build: 
      context: ../../
      dockerfile: ./apps/sgn/Dockerfile
    restart: always
    hostname: worker-task
    working_dir: /code
    env_file:
      - .env 
    command: >
      celery -A sgn worker 
      -l info 
      --concurrency=1 
      --max-tasks-per-child=50 
      --max-memory-per-child=150000
    volumes:
      - ../../repos/sgn:/code
      - catalogos_pdf_data:/code/volumes/catalogo/pdf
      - catalogos_json_data:/code/volumes/catalogo/json
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
      - PYTHONHASHSEED=random
    networks:
      - net_db
      - net_boot
      - net_web_only
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      django:
        condition: service_healthy
  #docker exec -it fsilva-cloud-dev-celery-worker-1 celery -A sgn purge

  # BEAT
  celery-beat:
    build: 
      context: ../../
      dockerfile: ./apps/sgn/Dockerfile
    restart: always
    hostname: worker-beat
    working_dir: /code
    env_file:
      - .env 
    command: celery -A sgn beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 120
    volumes:
      - ../../repos/sgn:/code
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      django:
        condition: service_healthy

