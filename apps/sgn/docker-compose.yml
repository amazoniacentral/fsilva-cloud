x-django-base: &django-base
  image: ghcr.io/amazoniacentral/sgn/sgn:v1.1.180
  restart: always
  working_dir: /code
  env_file:
    - .env
  dns:
    - 1.1.1.1
    - 8.8.8.8
  networks:
    - default
    - net_boot
    - net_n8n
    - net_db
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/code
    - MALLOC_ARENA_MAX=2

services:
  # NGINX - Porta de entrada
  django-nginx:
    image: nginx:alpine
    restart: always
    hostname: static-server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - sgn_data:/code/staticfiles:ro
    working_dir: /volumes
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    depends_on:
      django:
        condition: service_healthy
        
  # APP PRINCIPAL (Django)
  django:
    <<: *django-base
    hostname: api
    command: >
      sh -c "python manage.py migrate --noinput && 
            python manage.py collectstatic --noinput && 
            python manage.py gerar_sites_html && 
            gunicorn sgn.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gevent --worker-connections 1000 --timeout 120 --max-requests 500 --max-requests-jitter 50 --keep-alive 2"
    volumes:
      - sgn_data:/code/staticfiles
      - media_data:/code/volumes/media
      - catalogos_pdf_compress_data:/code/volumes/catalogo/compress
      - catalogos_pdf_data:/code/volumes/catalogo/pdf
      - catalogos_json_data:/code/volumes/catalogo/json
      - gvendas_data:/code/volumes/html
      - storage_data:/code/volumes/private
      - certificados_data:/code/volumes/certificados
      - traefik_dynamics:/code/volumes/dynamic
      - backups:/code/volumes/backups
      - ~/.ssh:/root/.ssh:ro
      - ~/.ssh/id_rsa_oidc:/code/.oidc.key:ro
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
        
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 8000))'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2100s

  # WORKER
  django-celery-worker:
    <<: *django-base
    hostname: worker-task
    command: >
      celery -A sgn worker 
      -l info 
      --concurrency=1 
      --max-tasks-per-child=50 
      --max-memory-per-child=190000
    volumes:
      - catalogos_pdf_data:/code/volumes/catalogo/pdf
      - catalogos_pdf_compress_data:/code/volumes/catalogo/compress
      - catalogos_json_data:/code/volumes/catalogo/json
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
      - PYTHONHASHSEED=random
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      django:
        condition: service_healthy
        
  # BEAT
  django-celery-beat:
    <<: *django-base
    hostname: worker-beat
    command: celery -A sgn beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 120
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M
    depends_on:
      redis:
        condition: service_started
      django:
        condition: service_healthy
      django-celery-worker:
        condition: service_started

networks:
  default:
  net_boot:
  net_n8n:
  net_db:

volumes:
  sgn_data:
  media_data:
  catalogos_pdf_compress_data:
  catalogos_pdf_data:
  catalogos_json_data:
  gvendas_data:
  storage_data:
  certificados_data:
  traefik_dynamics:
  backups:
