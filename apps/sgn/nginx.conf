server {
    listen 80;
    server_name _;
    root /code/;

    # Máximo de upload
    client_max_body_size 20M;

    # ATIVA AS MÉTRICAS PARA O NETDATA
    location ~ ^/(stub_status|nginx_status|status|basic_status) {
        stub_status on;
        access_log off;
        allow 172.18.0.0/16; 
        deny all;            
    }

    # Serve os arquivos estáticos
    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve arquivos de mídia
    location /media/ {
        alias /code/volumes/media/;
        expires 30d;
    }

    location / {
        # --- CONFIGURAÇÃO CRÍTICA PARA RESOLUÇÃO DINÂMICA ---
        # 127.0.0.11 é o DNS interno do Docker
        resolver 127.0.0.11 valid=5s;

        # Criamos uma variável que força a re-resolução do DNS
        set $django_app "django:8000";

        # Usamos a variável no proxy_pass
        proxy_pass http://$django_app;
        # ----------------------------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    
        # --- CONFIGURAÇÕES DE STREAM (IPHONE) ---
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}



server {
    listen 80;
    server_name auth.gvendas.app.br; # <--- Altere para o seu subdomínio de login real
    root /code/;

    # Máximo de upload
    client_max_body_size 20M;

    # Serve os arquivos estáticos (essencial para carregar o CSS/estilos da tela de login)
    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 1. BLOQUEIO DE SEGURANÇA: Qualquer rota que não seja de login é barrada com 404
    location / {
        return 404;
    }

    # 2. LIBERAÇÃO EXCLUSIVA: Apenas rotas de autenticação, OAuth, OIDC e .well-known passam para o Django
    location ~ ^/(o/|accounts/|login/|logout/|\.well-known/) {
        # --- CONFIGURAÇÃO CRÍTICA PARA RESOLUÇÃO DINÂMICA DO DOCKER ---
        resolver 127.0.0.11 valid=5s;
        set $django_app "django:8000";
        proxy_pass http://$django_app;
        # ----------------------------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    
        # --- CONFIGURAÇÕES DE STREAM / TIMEOUT ---
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
