services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    restart: always
    hostname: storage
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    depends_on:
      django:
        condition: service_healthy
          
          