server {
    listen 80;
    server_name localhost;

    log_format debug_auth
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status '
        'empresa_id="$empresa_id_da_auth" '
        'uri="$uri"';

    access_log /var/log/nginx/access.log debug_auth;
    error_log /var/log/nginx/error.log debug;

    location / {

        # Autenticação
        auth_request /internal_auth_check;

        # Captura o header retornado pelo Django
        auth_request_set $empresa_id_da_auth $upstream_http_x_empresa_id;

        # Headers temporários para debug
        add_header X-Debug-Empresa-Id $empresa_id_da_auth always;
        add_header X-Debug-URI $uri always;

        # Diretório dinâmico
        root /storage/$empresa_id_da_auth;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        try_files $uri =404;
    }

    location = /internal_auth_check {
        internal;

        proxy_pass http://django:8000/api/user/validar-traefik/;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }
}