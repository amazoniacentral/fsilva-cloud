# Mantemos o seu mapa original
map $http_x_empresa_id $empresa_path {
    default "anonimo";
    "~.+"    $http_x_empresa_id;
}

server {
    listen 80;
    server_name localhost;

    # Logs de depuração importantes para ver a comunicação com o Django
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log debug;

    root /storage;

    location / {
        # --- ESSA É A MÁGICA QUE SUBSTITUI O TRAEFIK ---
        # Chama a rota interna que vai até o Django
        auth_request /internal_auth_check;

        # O Traefik extrai o X-Empresa-Id da resposta do Django e injeta no header.
        # Aqui fazemos o mesmo: pegamos do upstream (Django) e colocamos na variável.
        auth_request_set $empresa_id_da_auth $upstream_http_x_empresa_id;
        
        # Sobrescrevemos o header para que o 'map' lá no topo funcione
        proxy_set_header X-Empresa-Id $empresa_id_da_auth;
        # -----------------------------------------------

        # Seu bloco de regras original (JS, CSS, Imagens, etc)
        # Nota: Mudei para / para pegar tudo, mas pode manter o seu regex
        root /storage/$empresa_id_da_auth/; # Usando a variável vinda do Django
        
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        try_files $uri =404;
    }

    # Rota interna que simula o ForwardAuth do Traefik
    location = /internal_auth_check {
        internal;
        # Aponta direto para o container do Django na rede do Docker
        proxy_pass http://django:8000/api/user/validar-traefik/;
        
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        # Repassa os headers originais (inclusive o Authorization Basic que o usuário digitar)
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
