services:
  videos:
    image: ghcr.io/amazoniacentral/videos/videos:v1.0.41
    expose:
      - "3000"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    volumes:
      - videos_data:/app/data  
      - videos_files:/var/www/videos
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - net_web_only
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.05'
          memory: 100M

  nginx-videos:
    image: nginx:alpine
    volumes:
      - videos_files:/var/www/videos:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro 
    expose:
      - "80"
    restart: always
      
    deploy:
      resources:
        limits:
          cpus: '0.5'    
          memory: 256M   
        reservations:
          cpus: '0.05'
          memory: 32M   
          
    depends_on:
      videos:
        condition: service_started
          
