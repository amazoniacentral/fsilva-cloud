services:
  videos:
    image: ghcr.io/amazoniacentral/videos/videos:v1.0.18
    volumes:
      - videos_data:/var/www/videos
    expose:
      - "3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.05'
          memory: 100M

  nginx-videos:
    image: nginx:alpine
    volumes:
      - videos_data:/var/www/videos:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro 
    expose:
      - "80"
    restart: always
      
    deploy:
      resources:
        limits:
          cpus: '0.5'    
          memory: 256M   
        reservations:
          cpus: '0.05'
          memory: 32M   
          
    depends_on:
      videos:
        condition: service_started
          
