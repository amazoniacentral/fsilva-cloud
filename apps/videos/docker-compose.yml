services:
  dev-videos:
    build:
      context: .
      dockerfile: DockerfileDev  
    container_name: dev-videos
    restart: unless-stopped
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules 
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.05'
          memory: 100M
      
      
    tty: true
    stdin_open: true
