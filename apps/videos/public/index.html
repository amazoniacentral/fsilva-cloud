<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Vídeos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="mt-3">
          <a href="/upload.html" class="btn btn-secondary">Novo Upload</a>
        </div>
        <h2>Vídeos Disponíveis</h2>
        <table class="table table-striped table-hover mt-3 bg-white shadow-sm">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Tamanho</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="videoTableBody"></tbody>
        </table>
    </div>

    <script>
        function formatarData(dataISO) {
            if (!dataISO) return '-';
            const data = new Date(dataISO);
            return data.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        fetch('/videos-list')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('videoTableBody');
                tbody.innerHTML = '';
                data.forEach(v => {
                    tbody.innerHTML += `<tr>
                        <td><strong>${v.titulo || 'Sem Título'}</strong></td>
                        <td>${v.id}</td>
                        <td>${formatarData(v.dataCriacao)}</td>
                        <td>${v.tamanhoMB || 0} MB</td>
                        <td>${v.codificado ? '<span class="badge bg-success">Pronto</span>' : '<span class="badge bg-warning">Processando</span>'}</td>
                        <td>${v.codificado ? `<a href="/player.html?id=${v.id}" class="btn btn-sm btn-info">Assistir</a>` : '-'}</td>
                    </tr>`;
                });
            });
    </script>
</body>
</html>
