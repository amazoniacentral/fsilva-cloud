<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Upload de Vídeo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .progress-container { width: 100%; border: 1px solid #ccc; height: 20px; margin-top: 10px; }
        #progressBar { width: 0%; height: 100%; background: #4caf50; transition: width 0.2s; }
    </style>
</head>
<body>
    <h2>Upload de Vídeo</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadVideo()">Enviar Vídeo</button>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>
    <p id="status"></p>

    <script>
        async function uploadVideo() {
            const file = document.getElementById('fileInput').files[0];
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');

            if (!file) return alert("Selecione um arquivo");

            const CHUNK_SIZE = 2 * 1024 * 1024; // 2MB
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);

                status.innerText = `Enviando pedaço ${i + 1} de ${totalChunks}...`;

                try {
                    const response = await fetch('/upload-chunk', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/octet-stream',
                            'X-Filename': file.name,
                            'X-Chunk-Index': i,
                            'X-Is-Last': (i === totalChunks - 1)
                        },
                        body: chunk
                    });

                    if (!response.ok) throw new Error("Falha no upload");
                    
                    progressBar.style.width = ((i + 1) / totalChunks) * 100 + "%";
                } catch (err) {
                    status.innerText = "Erro ao enviar: " + err.message;
                    return;
                }
            }
            status.innerText = "Upload concluído! O servidor está processando o vídeo.";
        }
    </script>
</body>
</html>
