<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Player de Vídeo</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h2>Assistir Vídeo</h2>
    <input type="text" id="folderId" placeholder="Cole o ID da pasta">
    <button onclick="carregarVideo()">Carregar</button>
    
    <br><br>
    <!-- Adicionamos o atributo 'playsinline' abaixo -->
    <video id="video" controls width="640" playsinline></video>

    <script>
        function carregarVideo() {
            const id = document.getElementById('folderId').value;
            // Corrigido para a porta 3000 (ajuste se seu servidor estiver em outra)
            const videoSrc = `/videos/${id}/master.m3u8`;
            const video = document.getElementById('video');

            if (Hls.isSupported()) {
                const hls = new Hls({ autoStartLoad: true });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }
    </script>
</body>
</html>
