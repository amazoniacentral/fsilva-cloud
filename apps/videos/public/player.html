<!DOCTYPE html>
<html>
<head>
    <title>Player de Vídeo</title>
    <!-- Carrega a biblioteca HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h2>Assistir Vídeo</h2>
    <!-- O ID do vídeo é a pasta que o FFmpeg criou (o timestamp) -->
    <input type="text" id="folderId" placeholder="Cole o ID da pasta (ex: 1721855...)">
    <button onclick="carregarVideo()">Carregar</button>
    
    <br><br>
    <video id="video" controls width="640"></video>

    <script>
        function carregarVideo() {
            const id = document.getElementById('folderId').value;
            const video = document.getElementById('video');
            // A URL aponta para o servidor e a pasta que o ffmpeg criou
            const videoSrc = `http://localhost:3001/videos/${id}/v0/playlist.m3u8`;

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
