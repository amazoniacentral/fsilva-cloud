<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-dark text-white p-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Título dinâmico aqui -->
                <h3 id="videoTitle" class="mb-3">Carregando vídeo...</h3>
                
                <video id="video" controls playsinline style="width: 100%; height: auto; background-color: #000;"></video>
                
                <div class="mt-3">
                    <a href="/" class="btn btn-secondary">Voltar para lista</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const video = document.getElementById('video');
        const titleElement = document.getElementById('videoTitle');
        const videoSrc = `https://videos.francsilva.com.br/${videoId}/master.m3u8`;

        // Busca a lista de vídeos para encontrar os metadados deste ID
        fetch('/videos-list')
            .then(res => res.json())
            .then(videos => {
                const videoData = videos.find(v => v.id === videoId);
                if (videoData) {
                    titleElement.innerText = videoData.titulo || "Vídeo Sem Título";
                } else {
                    titleElement.innerText = "Vídeo não encontrado";
                }
            })
            .catch(() => {
                titleElement.innerText = "Erro ao carregar detalhes do vídeo";
            });

        // Lógica do Player
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>
</body>
</html>
