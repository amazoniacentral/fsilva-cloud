<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2>Upload de Vídeo</h2>
            <div class="mb-3">
                <input type="file" id="fileInput" class="form-control">
            </div>
            <button onclick="uploadVideo()" class="btn btn-primary">Enviar Vídeo</button>
            
            <div class="progress mt-3" style="height: 25px;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
            <p id="status" class="mt-2 text-muted"></p>
        </div>
    </div>

    <script>
        async function uploadVideo() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Selecione um arquivo");

            const CHUNK_SIZE = 2 * 1024 * 1024;
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const progressBar = document.getElementById('progressBar');
            const status = document.getElementById('status');

            for (let i = 0; i < totalChunks; i++) {
                const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                try {
                    const response = await fetch('/upload-chunk', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/octet-stream',
                            'X-Filename': file.name,
                            'X-Chunk-Index': i,
                            'X-Is-Last': (i === totalChunks - 1)
                        },
                        body: chunk
                    });
                    if (!response.ok) throw new Error("Erro no servidor");
                    progressBar.style.width = ((i + 1) / totalChunks) * 100 + "%";
                } catch (err) {
                    status.innerText = "Erro: " + err.message;
                    return;
                }
            }
            status.innerText = "Upload finalizado!";
        }
    </script>
</body>
</html>
