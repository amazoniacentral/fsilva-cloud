services:
  whatsapp:
    build: 
      context: ../../
      dockerfile: ./apps/whatsapp/Dockerfile
    restart: always
    hostname: whatsapp
    env_file:
      - .env 
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    volumes:
      - ../../repos/push:/code
      - whatsapp_node_modules:/code/node_modules
      - whatsapp_sessions:/code/sessions
      - whatsapp_logs:/code/logs
    networks:
      net_boot:
        aliases:
          - whatsapp-srv
      net_web_only:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    expose:
      - ${PORT:-3000}
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 64M

