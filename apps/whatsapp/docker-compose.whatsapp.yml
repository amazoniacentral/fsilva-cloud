services:
  whatsapp:
    image: ghcr.io/amazoniacentral/whatsapp/whatsapp:v1.0.18
    restart: always
    hostname: whatsapp
    env_file:
      - .env 
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code/src
    volumes:
      - whatsapp_sessions:/code/src/sessions
      - whatsapp_logs:/code/src/logs
    networks:
      net_boot:
        aliases:
          - whatsapp-srv
      net_n8n:
      net_web_only:
    expose:
      - ${PORT:-3000}
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 64M

