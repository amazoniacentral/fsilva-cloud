services:
  pgadmin:
    image: dpage/pgadmin4:latest
    hostname: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminSecure2026##}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    networks:
      - default
      - net_db   
      - net_proxy
      - net_tunnel   
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
  net_db:
    external: true
  net_proxy:
    external: true
  net_tunnel:
    external: true

volumes:
  pgadmin_data:
