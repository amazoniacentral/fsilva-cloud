services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    hostname: db-postgres
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 128M

    env_file: 
      - .env

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"                     
      - "idle_session_timeout=5000"


    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - net_db
      
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

