services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile

    restart: always
    hostname: postgres
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 1024M
        reservations:
          cpus: '0.05'
          memory: 128M

    env_file: 
      - .env

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"                     
      - "idle_session_timeout=60000"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - default
      - net_db
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

networks:
  default:
  net_db:

volumes:
  postgres_data:
