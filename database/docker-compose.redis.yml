services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    hostname: db-redis 
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 3600 1
      --loglevel warning

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    volumes:
      - redis_data:/data

    networks:
      - web

volumes:
  redis_data:

networks:
  web:
    external: true
