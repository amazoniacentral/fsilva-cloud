services:
  redis:
    image: redis:7-alpine
    restart: always
    hostname: redis 
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 3600 1
      --loglevel warning

    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    volumes:
      - redis_data:/data
    sysctls:
      - vm.overcommit_memory=1      
    networks:
      - default
      - net_db

networks:
  default:
  net_db:

volumes:
  redis_data:
