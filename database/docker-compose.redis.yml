services:
  redis:
    image: redis:7-alpine
    # container_name: redis
    restart: always
    hostname: ${COMPOSE_PROJECT_NAME}-redis 
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 3600 1
      --loglevel warning

    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

    volumes:
      - redis_data:/data

    networks:
      - net_db
