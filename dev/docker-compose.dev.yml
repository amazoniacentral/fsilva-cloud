services:
  nginx:
    ports:
      - "127.0.0.1:8001:80"
    env_file:
      - .env
    labels:
      - "traefik.http.routers.nginx.rule=Host(`${API_DOMAIN:?api.seu-dominio.com}`)"
    networks:
      - web
  gvendas:
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - web
  media:
