      - .env
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - web
  storage:
    env_file:
      - .env
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - web
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  
  tunnel:
    env_file:
      - .env
