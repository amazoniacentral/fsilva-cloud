# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  traefik:
    ports: !override
      - "127.0.0.1:9090:80"
      - "127.0.0.1:9443:443"

    env_file:
      - ./proxy/.env.dev

  gvendas:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
    ports: !override
      - "127.0.0.1:8081:80"
    networks:
      - web

  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-worker:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-beat:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev

  nginx:
    ports: !override
      - "127.0.0.1:8081:80"
    networks:
      - web
