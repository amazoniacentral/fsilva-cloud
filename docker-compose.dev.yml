# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  traefik:
    ports: !override
      - 9090:9090
      - 9443:9443
    env_file: !override
      - ./proxy/.env
      - ./proxy/.env.dev
    command: !override
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # LIGA OS LOGS DE ACESSO (Necessário para os gráficos de requisições)
      - "--accesslog=true"
      # HABILITA O SISTEMA DE MÉTRICAS INTERNAS
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # CONFIGURAÇÕES DE PROVIDERS
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:9090"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:9443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
  
  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-worker:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-beat:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev

  nginx:
    ports:
      - 8081:80
    networks:
      - web
