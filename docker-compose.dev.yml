# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  traefik:
    ports: !override
      - 9090:80
      - 9443:443
    env_file:
      - ./proxy/.env.dev
    command:
      - "--entrypoints.web.address=:9090"
      - "--entrypoints.websecure.address=:9443"
  
  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-worker:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  celery-beat:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev

  nginx:
    ports:
      - 8081:80
    networks:
      - web
