# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  # Aqui você lista os nomes dos serviços que quer "alterar" para o modo Dev
  # O nome do serviço deve ser IDENTICO ao que está nos arquivos incluídos
  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev
  
  nginx:
    ports:
      - 8080:443
    networks:
      - web
    labels:
      - "traefik.http.routers.nginx-sgn.rule=Host(`localhost`)"