# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  traefik:
    env_file:
      - ./proxy/.env.dev
    environment:
      - HTTP_PORT=${HTTP_PORT}
      - HTTPS_PORT=${HTTPS_PORT}
  
  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev

  nginx:
    ports:
      - 8081:80
    networks:
      - web
