# /opt/fsilva-cloud/docker-compose.dev.yml
name: fsilva-cloud-dev

include:
  - ./docker-compose.yml

services:
  traefik:
    env_file:
      - ./proxy/.env.dev
  
  django:
    env_file:
      - ./gvendas-suite/sgn/.env.dev
  
  tunnel:
    env_file:
      - ./tunel/.env.dev

  nginx:
    ports:
      - 8081:80
    networks:
      - web
