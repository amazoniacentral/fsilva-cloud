# fsilva-cloud/docker-compose.yml
include:
  - ./proxy/docker-compose.traefik.yml
  - ./gvendas-suite/sgn/docker-compose.sgn.yml
  - ./gvendas-suite/gvendas/docker-compose.gvendas.yml
  - ./gvendas-suite/whatsapp/docker-compose.whatsapp.yml
  - ./gvendas-suite/cdn/docker-compose.cdn.yml
  - ./gvendas-suite/storage/docker-compose.storage.yml
  - ./database/docker-compose.redis.yml
  - ./database/docker-compose.postgres.yml
  - ./netdata/docker-compose.netdata.yml

volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  traefik_dynamics:
    name: traefik_dynamics
  sgn_statics:
    name: sgn_statics
  gvendas_data:
    name: gvendas_data
  storage_data:
    name: storage_data
  media_data:
    name: media_data
  sgn_data:
    name: sgn_data
  netdataconfig:
    name: netdataconfig
  netdatalib:
    name: netdatalib
  netdatacache:
    name: netdatacache
  whatsapp_node_modules:
    name: whatsapp_node_modules
  whatsapp_sessions:
    name: whatsapp_sessions
  whatsapp_logs:
    name: whatsapp_logs
  certificados_data:
    name: certificados_data
  backups:
    name: backups
    
networks:
  web:
    name: web
    driver: bridge
  net_proxy:
    name: net_proxy
    driver: bridge
    internal: true
  net_boot:
    name: net_boot
    driver: bridge
    internal: true
  net_db:
    name: net_db
    driver: bridge
    internal: true
  net_data:
    name: net_data
    driver: bridge
    internal: true
    
