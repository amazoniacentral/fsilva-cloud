# fsilva-cloud/docker-compose.yml
name: fsilva-cloud-prod

include:
  - ./proxy/docker-compose.traefik.yml
  - ./tunel/docker-compose.tunel.yml
  - ./gvendas-suite/docker-compose.gvendas.yml
  - ./database/docker-compose.redis.yml
  - ./database/docker-compose.postgres.yml
  - ./netdata/docker-compose.netdata.yml

volumes:
  postgres_data:
  redis_data:
  traefik_dynamics:
  gvendas_data:
  storage_data:
  media_data:
  sgn_data:
  netdataconfig:
  netdatalib:
  netdatacache:
  whatsapp_node_modules:
  whatsapp_sessions:
  whatsapp_logs:
  certificados_data:
  backups:
    
networks:
  web:
    name: web
    driver: bridge
  net_proxy:
    name: net_proxy
    driver: bridge
    internal: true
  net_boot:
    name: net_boot
    driver: bridge
    internal: true
  net_db:
    name: net_db
    driver: bridge
    internal: true
  net_data:
    name: net_data
    driver: bridge
    internal: true
  net_storage:
    name: net_storage
    driver: bridge
    internal: true
