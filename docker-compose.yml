# fsilva-cloud/docker-compose.yml
include:
  - ./proxy/docker-compose.traefik.yml
  - ./gvendas-suite/sgn-django/docker-compose.django.yml
  - ./gvendas-suite/app-react/docker-compose.react.yml
  - ./gvendas-suite/msg-node/docker-compose.node.yml
  - ./database/docker-compose.redis.yml
  - ./database/docker-compose.postgres.yml
  - ./netdata/docker-compose.netdata.yml

volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  traefik_dynamics:
    name: traefik_dynamics
  sgn_statics:
    name: sgn_statics
  sgn_media:
    name: sgn_media
  sgn_pwa:
    name: sgn_pwa
  documentos:
    name: documentos
  netdataconfig:
    name: netdataconfig
  netdatalib:
    name: netdatalib
  netdatacache:
    name: netdatacache
  msg_node_modules:
    name: msg_node_modules
  msg_sessions:
    name: msg_sessions
  msg_logs:
    name: msg_logs
  certificados:
    name: certificados
  backups:
    name: backups
    
networks:
  web:
    name: web
    driver: bridge
  net_proxy:
    name: net_proxy
    driver: bridge
    internal: true
  net_boot:
    name: net_boot
    driver: bridge
    internal: true
  net_db:
    name: net_db
    driver: bridge
    internal: true
  net_data:
    name: net_data
    driver: bridge
    internal: true
    
