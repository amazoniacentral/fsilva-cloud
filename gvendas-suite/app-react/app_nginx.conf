server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index $host.html;

    # DNS interno do Docker para resolver nomes de containers dinamicamente
    resolver 127.0.0.11 valid=30s;

    # --- TRATAMENTO DE ERROS GLOBAL ---
    # Captura erros do Django (como o 400 que deu erro 500) e exibe algo limpo
    error_page 400 401 403 404 500 502 503 504 = @error_pages;
    
    location @error_pages {
        # Aqui o Traefik pode interceptar ou você define um retorno simples
        return 404 "Acesso negado ou empresa não encontrada.";
        default_type text/html;
    }

    # 1. PRIORIDADE MÁXIMA: Service Worker (Sempre sem cache e validando empresa)
    location = /service-worker.js {
        auth_request /validar-empresa;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 2. Manifest PWA (Multi-tenant e sem cache)
    location /manifest.json {
        alias /usr/share/nginx/html/manifest/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        default_type application/json;
    }

    # 3. Assetlinks (TWA / Android)
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/.well-known/sgn_pwa/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type application/json;
    }

    # 4. Arquivos Estáticos (Cache longo e NÃO vai ao Django)
    # Protegido por regex para não pegar arquivos sem extensão que seriam rotas
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 5. PRIORIDADE PADRÃO: HTML e Rotas do PWA (Validando empresa e sem cache)
    location / {
        auth_request /validar-empresa;
        
        # Entrega o HTML multi-tenant para qualquer rota virtual
        try_files $uri $uri/ /$host.html;
    
        # Força o navegador a verificar atualizações toda vez
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        default_type text/html;
    }

    # --- DEMAIS RECURSOS ESPECÍFICOS ---

    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /catalogo.xml {
        auth_request /validar-empresa;
        auth_request_set $empresa_id $upstream_http_x_empresa_id;
        alias /usr/share/nginx/documentos/catalogo/;
        try_files $empresa_id/catalogo.xml =404;
    }

    location /catalogo.csv {
        auth_request /validar-empresa;
        auth_request_set $empresa_id $upstream_http_x_empresa_id;
        alias /usr/share/nginx/documentos/catalogo/;
        try_files $empresa_id/catalogo.csv =404;
    }

    location /backup.xlsx {
        auth_request /validar-usuario;
        auth_request_set $backup_file $upstream_http_x_backup_file;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        alias /usr/share/nginx/documentos/backup/;
        try_files $backup_file =404;
    }

    location /auth {
        auth_request /validar-usuario;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 204;
    }

    # --- INTERNAL AUTH REQUESTS ---

    location = /validar-empresa {
        internal;
        set $backend_django http://sgn-django:8000;
        proxy_pass $backend_django/api/site/$host/;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        # Intercepta erros 400+ do Django para o Nginx tratar
        proxy_intercept_errors on;
    }

    location = /validar-usuario {
        internal;
        set $auth_header $http_authorization;
        
        if ($arg_token = "") { set $test_auth "no_token"; }
        if ($auth_header = "") { set $test_auth "${test_auth}_no_header"; }
    
        if ($test_auth = "no_token_no_header") {
            add_header WWW-Authenticate 'Basic realm="Acesso Restrito"' always;
            return 401;
        }
    
        if ($auth_header = "") {
            set $auth_header "Bearer $arg_token";
        }
    
        set $backend_django http://sgn-django:8000;
        proxy_pass $backend_django/api/user/;
        proxy_set_header Authorization $auth_header;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        add_header Cache-Control "no-store" always;
        proxy_intercept_errors on;
    }
}
