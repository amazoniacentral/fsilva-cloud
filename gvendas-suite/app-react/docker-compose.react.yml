services:
  pwa:
    build: 
      # VERDADE: O contexto deve ser a raiz para enxergar o código em /repos ou /gvendas-suite
      context: ../../
      dockerfile: ./gvendas-suite/app-react/Dockerfile
    container_name: app-sgn-pwa
    restart: always
    hostname: pwa-frontend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # O volume externo que o Django já criou (com o prefixo que você decidiu manter)
      # O caminho do conf deve partir da raiz do projeto principal
      #- ./gvendas-suite/app-react/default.conf:/etc/nginx/conf.d/default.conf:ro
      - sgn_pwa:/usr/share/nginx/html
      - documentos:/usr/share/nginx/documentos:ro
      - certificados:/usr/share/nginx/.well-known:ro
      - sgn_media:/usr/share/nginx/media:ro
    networks:
      - net_proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app-sgn-pwa-service.loadbalancer.server.port=80"
      - "traefik.http.routers.app-sgn-pwa-internal.service=app-sgn-pwa-service"
      - "traefik.http.routers.app-sgn-pwa-internal.rule=Host(`internal.pwa`)"
      - "traefik.http.routers.app-sgn-pwa-internal.priority=1"
      # MIDDLEWARES
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.app-sgn-pwa.middlewares=block-internal-header,error-pages-middleware"

