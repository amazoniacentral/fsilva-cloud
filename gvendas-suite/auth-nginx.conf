# --- CONFIGURAÇÃO DE VALIDAÇÃO COMPLETA E RESISTENTE ---

location = /validar-usuario {
    internal;
    
    # 1. Define o destino interno
    set $backend_django http://sgn-django:8000;
    
    # 2. Lógica de captura de Token (URL ou Header)
    set $auth_header $http_authorization;
    set $test_auth "";

    if ($arg_token = "") { 
        set $test_auth "no_token"; 
    }
    
    if ($auth_header = "") { 
        set $test_auth "${test_auth}_no_header"; 
    }
    
    # Se não houver nenhuma forma de autenticação, vai direto para o prompt
    if ($test_auth = "no_token_no_header") {
        return 401; # Será capturado pelo error_page abaixo para abrir o prompt
    }
    
    # Se o token estiver na URL (?token=...), reconstrói o Header Bearer para o Django
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    
    # 3. Faz a requisição para a API de usuário
    proxy_pass $backend_django/api/user/;
    
    # 4. ISOLAMENTO TOTAL: Força o Host a ser o nome do container
    proxy_set_header Host "sgn-django"; 
    
    # 5. LIMPEZA E SEGURANÇA: Remove headers que podem causar DisallowedHost
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";

    # 6. Passa o token reconstruído ou original no cabeçalho Authorization
    proxy_set_header Authorization $auth_header;
    
    # 7. Configurações de performance e interceptação
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    # 8. TRATAMENTO DE ERROS: Garante que o Nginx não dê 500 se o Django der 400 ou 502
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
    
    # 9. Cache headers
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

location = /validar-empresa {
    internal;
    proxy_pass http://sgn-django:8000/api/site/$host/;
    proxy_set_header Host "sgn-django";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_intercept_errors on;
    #error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
}

# Bloco unificado para o Prompt de Autenticação
location @exigir_auth {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 401;
}
