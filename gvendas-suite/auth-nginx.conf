# --- CONFIGURAÇÃO DE VALIDAÇÃO PERSONALIZADA ---

location = /validar-usuario {
    internal;
    
    set $backend_django http://sgn-django:8000;
    
    set $auth_header $http_authorization;
    set $test_auth "";

    if ($arg_token = "") { 
        set $test_auth "no_token"; 
    }
    
    if ($auth_header = "") { 
        set $test_auth "${test_auth}_no_header"; 
    }
    
    # Se não houver nada, retorna 401
    if ($test_auth = "no_token_no_header") {
        return 401; 
    }
    
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    
    proxy_pass $backend_django/api/user/;
    proxy_set_header Host "sgn-django"; 
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Authorization $auth_header;
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    proxy_intercept_errors on;
    error_page 400 401 403 500 502 503 504 = @abrir_prompt_usuario;
}

location = /validar-empresa {
    internal;
    proxy_pass http://sgn-django:8000/api/site/$host/;
    proxy_set_header Host "sgn-django";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = 404;
}

location @abrir_prompt_usuario {
    # IMPORTANTE: Este header precisa sair da sub-request para ser capturado fora
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    return 401;
}
