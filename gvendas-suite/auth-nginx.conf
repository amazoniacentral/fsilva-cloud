# --- CONFIGURAÇÃO DE VALIDAÇÃO PERSONALIZADA ---

location = /validar-usuario {
    internal;
    
    # 1. Define o destino interno
    set $backend_django http://sgn-django:8000;
    
    # 2. Lógica de captura de Token (URL ou Header)
    set $auth_header $http_authorization;
    set $test_auth "";

    if ($arg_token = "") { 
        set $test_auth "no_token"; 
    }
    
    if ($auth_header = "") { 
        set $test_auth "${test_auth}_no_header"; 
    }
    
    # Se não houver autenticação, vai para o prompt
    if ($test_auth = "no_token_no_header") {
        return 401; 
    }
    
    # Se o token estiver na URL (?token=...), reconstrói o Header Bearer
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    
    # 3. Faz a requisição para a API de usuário
    proxy_pass $backend_django/api/user/;
    
    # 4. Configurações de Host e Segurança
    proxy_set_header Host "sgn-django"; 
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";

    # 5. Passa o token reconstruído ou original
    proxy_set_header Authorization $auth_header;
    
    # 6. Performance
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    # 7. TRATAMENTO DE ERROS DO USUÁRIO: Intercepta e abre a janela de login
    proxy_intercept_errors on;
    error_page 400 401 403 500 502 503 504 = @abrir_prompt_usuario;
    
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /validar-empresa {
    internal;
    proxy_pass http://sgn-django:8000/api/site/$host/;
    proxy_set_header Host "sgn-django";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # 8. TRATAMENTO DE ERROS DA EMPRESA: Se não existir (404 ou 400) retorna 404 sem prompt
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = 404;
}

# BLOCO EXCLUSIVO PARA O PROMPT DE CREDENCIAIS (Apenas para validar-usuario)
location @abrir_prompt_usuario {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 401;
}
