#Validar Usiario
location = /validar-usuario {
    internal;
    
    # 1. Define o destino interno
    set $backend_django "http://sgn-django:8000";
    
    # 2. Lógica de captura de Token (URL ou Header)
    set $auth_header $http_authorization;
    set $test_auth "";

    if ($arg_token = "") { 
        set $test_auth "no_token"; 
    }
    
    if ($auth_header = "") { 
        set $test_auth "${test_auth}_no_header"; 
    }
    
    # Se não houver nenhuma forma de autenticação, retorna 401 COM o header que abre o prompt
    if ($test_auth = "no_token_no_header") {
        add_header WWW-Authenticate 'Basic realm="Acesso Restrito"' always;
        return 401;
    }
    
    # Se o token estiver na URL (?token=...), reconstrói o Header Bearer para o Django
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    
    # 3. Faz a requisição para a API de usuário
    proxy_pass http://sgn-django:8000/api/user/;
    
    # 4. ISOLAMENTO TOTAL
    proxy_set_header Host "sgn-django"; 
    
    # 5. LIMPEZA DE HEADERS
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";

    # 6. Passa o token no cabeçalho Authorization
    proxy_set_header Authorization $auth_header;
    
    # 7. Configurações de performance
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # 8. TRATAMENTO DE ERROS: Se o Django der 400, 403 ou 500, o Nginx transforma em 401 para pedir senha
    proxy_intercept_errors on;
    error_page 400 403 404 500 502 503 504 = @error401;
    
    # 9. Garante que o status não fique preso em cache
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# Bloco auxiliar para forçar o prompt de senha em caso de erro no backend
location @error401 {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito"' always;
    return 401;
}
