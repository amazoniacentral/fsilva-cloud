# --- CONFIGURAÇÃO DE VALIDAÇÃO (auth-nginx.conf) ---

location = /validar-usuario {
    internal;
    set $backend_django http://sgn-django:8000;
    
    set $auth_header $http_authorization;
    set $test_auth "";

    if ($arg_token = "") { set $test_auth "no_token"; }
    if ($auth_header = "") { set $test_auth "${test_auth}_no_header"; }
    
    # Se não houver nada, em vez de 401 seco, vamos mandar para o JS
    if ($test_auth = "no_token_no_header") {
        return 401; 
    }
    
    if ($auth_header = "") {
        set $auth_header "Bearer $arg_token";
    }
    
    proxy_pass $backend_django/api/user/;
    proxy_set_header Host "sgn-django"; 
    proxy_set_header Authorization $auth_header;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    proxy_intercept_errors on;
    # Qualquer erro de autenticação cai no nosso Prompt JS
    error_page 400 401 403 500 502 503 504 = @prompt_js;
}

# O BLOCO MÁGICO COM JAVASCRIPT
location @prompt_js {
    default_type text/html;
    return 200 '
    <html>
    <body style="background:#222;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
        <script>
            let user = prompt("Usuário:");
            let pass = prompt("Senha:");
            if (user && pass) {
                // Converte para Base64 (Basic Auth)
                let auth = btoa(user + ":" + pass);
                // Faz a requisição novamente injetando o Header
                fetch(window.location.href, {
                    headers: { "Authorization": "Basic " + auth }
                })
                .then(r => {
                    if(r.ok) {
                        // Se deu certo, podemos recarregar a página com o header (via cookie ou redirecionamento)
                        // Para arquivos como CSV, o ideal é redirecionar passando as credenciais ou salvar um cookie de sessão
                        document.body.innerHTML = "Autenticado! Carregando...";
                        window.location.reload();
                    } else {
                        alert("Falha na autenticação!");
                        window.location.reload();
                    }
                });
            } else {
                document.body.innerHTML = "Acesso Negado.";
            }
        </script>
    </body>
    </html>';
}

location = /validar-empresa {
    internal;
    proxy_pass http://sgn-django:8000/api/site/$host/;
    proxy_set_header Host "sgn-django";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = 404;
}
