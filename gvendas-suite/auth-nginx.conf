# --- CONFIGURAÇÃO DE VALIDAÇÃO (auth-nginx.conf) ---

# Bloco para validar usuário (usado em backups, etc)
location = /validar-usuario {
    internal;
    proxy_pass http://sgn-django:8000/api/user/;
    proxy_set_header Host "sgn-django";
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Se der erro ou não tiver token, manda para o prompt
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
}

# Bloco para validar empresa (usado no acesso ao site)
location = /validar-empresa {
    internal;
    # Usando string direta para evitar erros de resolução de variável
    proxy_pass http://sgn-django:8000/api/site/$host/;
    
    proxy_set_header Host "sgn-django";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Se o Django retornar 400 ou qualquer erro, o Nginx redireciona para o prompt de login
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
}

# O "Pulo do Gato": Este bloco abre o prompt padrão do navegador e não deixa o Nginx fechar com erro 500
location @exigir_auth {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 401;
}
