services:
  gvendas:
    build: 
      context: ../../
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
      dockerfile: ./gvendas-suite/gvendas/Dockerfile
    # container_name: gvendas
    restart: always
    hostname: ${COMPOSE_PROJECT_NAME}-gvendas
    working_dir: /usr/share/nginx/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gvendas_data:/usr/share/nginx/html
      - certificados_data:/usr/share/nginx/.well-known:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - net_proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-gvendas-service.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-gvendas-internal.service=${COMPOSE_PROJECT_NAME}-gvendas-service"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-gvendas-internal.rule=Host(`internal.pwa`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-gvendas-internal.priority=1"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-gvendas-service.loadbalancer.responseForwarding.flushInterval=100ms"
      # MIDDLEWARES
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-gvendas-service.middlewares=${COMPOSE_PROJECT_NAME}-block-internal-header,${COMPOSE_PROJECT_NAME}-error-pages-middleware"
      