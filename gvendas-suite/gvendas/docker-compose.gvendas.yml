services:
  gvendas:
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    build: 
      context: ../../
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
      dockerfile: ./gvendas-suite/gvendas/Dockerfile
    container_name: gvendas
    restart: always
    hostname: gvendas
    working_dir: /usr/share/nginx/html
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gvendas_data:/usr/share/nginx/html
      - certificados_data:/usr/share/nginx/.well-known:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - net_proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 64M
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gvendas-service.loadbalancer.server.port=80"
      - "traefik.http.routers.gvendas-internal.service=gvendas-service"
      - "traefik.http.routers.gvendas-internal.rule=Host(`internal.pwa`)"
      - "traefik.http.routers.gvendas-internal.priority=1"
      - "traefik.http.services.gvendas-service.loadbalancer.responseForwarding.flushInterval=100ms"
      # MIDDLEWARES
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.gvendas-service.middlewares=block-internal-header,error-pages-middleware"
      
  sgn_gerar_sites:
    image: alpine:latest
    container_name: sgn-init-gerarsites
    networks:
      - net_proxy
    depends_on:
      gvendas:
        condition: service_started # 1º Espera o GVendas estar pronto
      django:
        condition: service_healthy # 2º Depois checa se o Django passou no healthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "apk add --no-cache docker-cli && 
             docker exec sgn-django python manage.py gerar_sites_html"
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 32M
