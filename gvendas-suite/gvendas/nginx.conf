server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index $host.html;

    # DNS interno do Docker
    resolver 127.0.0.11 valid=30s;

    # 1. IMPORTAÇÃO DOS MÉTODOS DE VALIDAÇÃO
    #include /etc/nginx/auth-nginx.conf;

    # 1. PRIORIDADE MÁXIMA: Service Worker
    location = /service-worker.js {
        auth_request /validar-empresa;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Surrogate-Control "no-store" always;
        expires -1;
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
        try_files $uri =404;
    }

    # 2. Manifest PWA
    location /manifest.json {
        auth_request /validar-empresa;
        alias /usr/share/nginx/html/manifest/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        default_type application/json;
    }

    # 3. Assetlinks
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/.well-known/sgn_pwa/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        default_type application/json;
    }

    # 4. Arquivos Estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 5. PRIORIDADE PADRÃO: HTML e Rotas
    location / {
        auth_request /validar-empresa;
        try_files $uri $uri/ /$host.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type text/html;
    }

    # 6. Recursos Específicos
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location /catalogo.xml {
        auth_request /validar-empresa;
        auth_request_set $empresa_id $upstream_http_x_empresa_id;
        default_type application/xml;
        alias /usr/share/nginx/documentos/catalogo/;
        try_files $empresa_id/catalogo.xml =404;
    }

    location /backup.xlsx {
        auth_request /validar-usuario;
        auth_request_set $backup_file $upstream_http_x_backup_file;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition 'attachment; filename="$backup_file"';
        alias /usr/share/nginx/documentos/backup/;
        try_files $backup_file =404;
    }

    location /auth {
        auth_request /validar-usuario;
        return 204;
    }
    
    
    
    
    
    
    
    
# --- CONFIGURAÇÃO DE VALIDAÇÃO (auth-nginx.conf) ---

# Bloco para validar usuário (usado em backups e rotas que exigem login)
location = /validar-usuario {
    internal;
    proxy_pass http://sgn-django:8000/api/user/;
    
    proxy_set_header Host "sgn-django";
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Se der erro ou não tiver token, manda para o prompt
    proxy_intercept_errors on;
    error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
}

# Bloco para validar apenas a existência da empresa (acesso ao site)
location = /validar-empresa {
    internal;
    proxy_pass http://sgn-django:8000/api/site/$host/;
    
    proxy_set_header Host "sgn-django";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # Se o Django retornar erro (ex: empresa não existe), tratamos aqui
    proxy_intercept_errors on;
    # Se quiser que falhas na empresa TAMBÉM peçam senha, deixe a linha abaixo.
    # Se quiser apenas um erro 403 puro, comente a linha abaixo.
    error_page 400 401 403 404 500 502 503 504 = @exigir_auth;
}

# Bloco que força a abertura do prompt de usuário/senha do navegador
location @exigir_auth {
    add_header WWW-Authenticate 'Basic realm="Acesso Restrito - SGN"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 401;
}

}
