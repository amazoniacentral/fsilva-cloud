server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index $host.html;

    # DNS interno do Docker para resolver nomes de containers dinamicamente
    resolver 127.0.0.11 valid=30s;
    # 1. IMPORTAÇÃO DOS MÉTODOS DE VALIDAÇÃO
    # O caminho deve ser relativo ao diretório /etc/nginx/ ou caminho absoluto.
    # Exemplo: se o arquivo está em /etc/nginx/conf.d/auth-nginx.conf
    include /etc/nginx/auth-nginx.conf;

    # 1. PRIORIDADE MÁXIMA: Service Worker (Sempre sem cache e validando empresa)
    location = /service-worker.js {
        auth_request /validar-empresa;

        # 1. Mata o cache em todos os níveis possíveis
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Surrogate-Control "no-store" always;
        expires -1;

        # 2. Informa ao navegador que este SW pode controlar a raiz
        add_header Service-Worker-Allowed "/";

        # 3. Garante o tipo MIME correto para o navegador não ignorar o script
        default_type application/javascript;

        try_files $uri =404;
    }


    # 2. Manifest PWA (Multi-tenant e sem cache)
    location /manifest.json {
        auth_request /validar-empresa;
        
        alias /usr/share/nginx/html/manifest/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        default_type application/json;
    }

    # 3. Assetlinks (TWA / Android)
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/.well-known/sgn_pwa/;
        try_files $host.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        default_type application/json;
    }

    # 4. Arquivos Estáticos (Cache longo e NÃO vai ao Django)
    # Protegido por regex para não pegar arquivos sem extensão que seriam rotas
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 5. PRIORIDADE PADRÃO: HTML e Rotas do PWA (Validando empresa e sem cache)
    location / {
        auth_request /validar-empresa;
        
        # Entrega o HTML multi-tenant para qualquer rota virtual
        try_files $uri $uri/ /$host.html;
    
        # Força o navegador a verificar atualizações toda vez
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        default_type text/html;
    }

    # --- DEMAIS RECURSOS ESPECÍFICOS ---

    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /catalogo.xml {
        auth_request /validar-empresa;
        auth_request_set $empresa_id $upstream_http_x_empresa_id;
        
        # Define o tipo de conteúdo explicitamente
        default_type application/xml;
        
        # Headers para evitar que catálogos antigos fiquem presos no cache
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        alias /usr/share/nginx/documentos/catalogo/;
        try_files $empresa_id/catalogo.xml =404;
    }


    location /catalogo.csv {
        auth_request /validar-empresa;
        auth_request_set $empresa_id $upstream_http_x_empresa_id;
        
        # Define o tipo de conteúdo como CSV
        default_type text/csv;
        
        # Força o download ou abertura correta sem cache antigo
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        alias /usr/share/nginx/documentos/catalogo/;
        try_files $empresa_id/catalogo.csv =404;
    }


    location /backup.xlsx {
        auth_request /validar-usuario;
        auth_request_set $backup_file $upstream_http_x_backup_file;

        # Define o tipo MIME correto para arquivos Excel Modernos (XLSX)
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;

        # Força o navegador a tratar como download (Anexo)
        add_header Content-Disposition 'attachment; filename="$backup_file"';

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        alias /usr/share/nginx/documentos/backup/;
        try_files $backup_file =404;
    }


    location /auth {
        auth_request /validar-usuario;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 204;
    }

}
