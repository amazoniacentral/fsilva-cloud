services:
  # CDN - Arquivos Públicos
  media:
    image: nginx:alpine
    container_name: media
    restart: always
    hostname: media-server
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - media_data:/media_files:ro
    working_dir: /media_files
    env_file:
      - path: ../.env
        required: true
      - path: .env
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media-nginx.rule=Host(`${MEDIA_DOMAIN:?media.seudo-minio.com.br}`)"
      - "traefik.http.routers.media-nginx.entrypoints=websecure"
      - "traefik.http.routers.media-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.media-nginx.loadbalancer.server.port=80"
      - "traefik.http.services.media-nginx.loadbalancer.responseForwarding.flushInterval=100ms"
      # MIDDLEWARES
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.media-nginx.middlewares=block-internal-header,error-pages-middleware"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
  