server {
    listen 80;
    server_name localhost;
    root /media_files/;
    
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log debug;
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|csv|xml|xlsx|pdf|zip)$ {
        root /media_files/;
        # 1. Cache imutável para qualquer arquivo com nome único
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        
        # 2. Permite que o PWA baixe ou processe os arquivos (CORS)
        add_header Access-Control-Allow-Origin "*" always;
        
        # 3. Otimizações de entrega de arquivos do Kernel para a Rede
        sendfile on;
        tcp_nopush on;   # Envia cabeçalhos HTTP em um único pacote TCP
        tcp_nodelay on;  # Evita atrasos em pacotes pequenos
        
        # 4. Segurança: Impede que o navegador tente "adivinhar" o tipo de arquivo
        # Isso força o respeito ao MIME type definido pela extensão
        add_header X-Content-Type-Options "nosniff" always;
        
        # 5. Busca o arquivo físico
        try_files $uri =404;
    }

}
