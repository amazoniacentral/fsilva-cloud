services:
  # NGINX - Porta de entrada
  nginx:
    image: nginx:alpine
    container_name: sgn-nginx
    restart: always
    hostname: static-server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/code/volumes/staticfiles:ro
      - media_data:/code/volumes/media:ro
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-sgn.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.nginx-sgn.entrypoints=websecure"
      - "traefik.http.routers.nginx-sgn.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx-sgn.loadbalancer.server.port=80"
      - "traefik.http.services.nginx-sgn.loadbalancer.responseForwarding.flushInterval=100ms"
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.nginx-sgn.middlewares=block-internal-header"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # APP PRINCIPAL (Django)
  django:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn-django/Dockerfile
    container_name: sgn-django
    restart: always
    hostname: api-backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    command: gunicorn sgn.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gevent --worker-connections 1000 --timeout 120 --max-requests 500 --max-requests-jitter 50 --keep-alive 2
    volumes:
      - ../../repos/sgn:/code
      - static_data:/code/volumes/staticfiles
      - media_data:/code/volumes/media
      - fsilva-cloud_build_pwa:/code/volumes/build_pwa
      - fsilva-cloud_dynamic:/code/volumes/dynamic
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_proxy
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M

  # WORKER
  celery-worker:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn-django/Dockerfile
    container_name: sgn-celery-worker
    restart: always
    hostname: worker-task
    working_dir: /code
    command: >
      celery -A sgn worker 
      -l info 
      --concurrency=1 
      --max-tasks-per-child=50 
      --max-memory-per-child=150000
    volumes:
      - ../../repos/sgn:/code
    env_file: 
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
      - PYTHONHASHSEED=random
    networks:
      - net_db
      - net_boot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # BEAT
  celery-beat:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn-django/Dockerfile
    container_name: sgn-celery-beat
    restart: always
    hostname: worker-beat
    working_dir: /code
    command: celery -A sgn beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 120
    volumes:
      - ../../repos/sgn:/code
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M

networks:
  net_proxy:
    external: true
  net_db:
    external: true
  net_boot:
    external: true

volumes:
  static_data:
  media_data:
  fsilva-cloud_build_pwa:
    external: true
  fsilva-cloud_dynamic:
    external: true
