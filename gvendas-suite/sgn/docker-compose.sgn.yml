services:
  # NGINX - Porta de entrada
  nginx:
    image: nginx:alpine
    container_name: sgn-nginx
    restart: always
    hostname: static-server
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - sgn_data:/code/staticfiles:ro
    working_dir: /volumes
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-sgn.rule=Host(`${API_DOMAIN:?api.seu-dominio.com}`)"
      - "traefik.http.routers.nginx-sgn.entrypoints=websecure"
      - "traefik.http.routers.nginx-sgn.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx-sgn.loadbalancer.server.port=80"
      - "traefik.http.services.nginx-sgn.loadbalancer.responseForwarding.flushInterval=100ms"
      
      # Nas labels do seu container DJANGO (SGN) ou onde o middleware foi criado:
      - "traefik.http.middlewares.auth-django.forwardauth.address=http://sgn-django:8000/api/user/validar-traefik/"
      - "traefik.http.middlewares.auth-django.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth-django.forwardauth.authResponseHeaders=X-Empresa-Id"

      # MIDDLEWARES
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
     # - "traefik.http.routers.nginx-sgn.middlewares=block-internal-header,error-pages-middleware"
      - "traefik.http.routers.nginx-sgn.middlewares=block-internal-header"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  # APP PRINCIPAL (Django)
  django:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn/Dockerfile
    container_name: sgn-django
    restart: always
    hostname: api
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    command: gunicorn sgn.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gevent --worker-connections 1000 --timeout 120 --max-requests 500 --max-requests-jitter 50 --keep-alive 2
    volumes:
      - ../../repos/sgn:/code
      - sgn_data:/code/staticfiles
      - media_data:/code/volumes/media
      - gvendas_data:/code/volumes/html
      - storage_data:/code/volumes/private
      - certificados_data:/code/volumes/certificados
      - traefik_dynamics:/code/volumes/dynamic
      - backups:/code/volumes/backups
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_proxy
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 8000))'"]
     # test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Dá 30 segundos para as migrações rodarem
  
  # APP DEVELOPER (Django) - Isolado
  django-dev:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn/Dockerfile
    container_name: sgn-django-dev
    restart: unless-stopped # Permite parar manualmente sem o docker subir sozinho
    hostname: api-dev
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /code
    env_file:
      - path: ../.env
        required: true
      - path: .env.dev # ONDE ESTÁ O SEU DEBUG=True E CONFIGS DE DEV
        required: false
    # Rodando na 8001 para o túnel apontar direto nela e não conflitar
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ../../repos/sgn:/code
    environment:
      - IS_DEV_CONTAINER=true
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_proxy
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.8' # Mais fôlego para IA e PDFs
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.connect((\"localhost\", 8001))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WORKER
  celery-worker:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn/Dockerfile
    container_name: sgn-celery-worker
    restart: always
    hostname: worker-task
    working_dir: /code
    command: >
      celery -A sgn worker 
      -l info 
      --concurrency=1 
      --max-tasks-per-child=50 
      --max-memory-per-child=150000
    volumes:
      - ../../repos/sgn:/code
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
      - PYTHONHASHSEED=random
    networks:
      - net_db
      - net_boot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # WORKER CELERY - DEVELOPER
  celery-worker-dev:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn/Dockerfile
    container_name: sgn-celery-worker-dev
    restart: unless-stopped
    hostname: worker-dev
    working_dir: /code
    command: >
      celery -A sgn worker 
      -l info 
      --concurrency=1 
      --max-tasks-per-child=50 
      --max-memory-per-child=150000
      -Q dev_queue
      -n dev_worker@%h
    volumes:
      - ../../repos/sgn:/code
    env_file:
      - path: ../.env
        required: true
      - path: .env.dev
        required: false
    environment:
      - IS_DEV_CONTAINER=true
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
      - PYTHONHASHSEED=random
    networks:
      - net_db
      - net_proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # BEAT
  celery-beat:
    build: 
      context: ../../
      dockerfile: ./gvendas-suite/sgn/Dockerfile
    container_name: sgn-celery-beat
    restart: always
    hostname: worker-beat
    working_dir: /code
    command: celery -A sgn beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval 120
    volumes:
      - ../../repos/sgn:/code
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/code
      - MALLOC_ARENA_MAX=2
    networks:
      - net_db
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 768M
        reservations:
          cpus: '0.05'
          memory: 128M

