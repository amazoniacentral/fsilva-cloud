server {
    listen 80;
    server_name localhost;

    # Máximo de upload (ajuste se necessário)
    client_max_body_size 20M;

    # ATIVA AS MÉTRICAS PARA O NETDATA (Resolve o erro do Django)
    location ~ ^/(stub_status|nginx_status|status|basic_status) {
        stub_status on;
        access_log off;
        allow 172.18.0.0/16; # Permite apenas a rede interna do Docker
        deny all;            # Bloqueia acesso externo
    }

    # Serve os arquivos estáticos
    location /static/ {
        alias /code/volumes/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve arquivos de mídia (uploads de usuários)
    location /media/ {
        alias /code/volumes/media/;
        expires 30d;
    }

    # Encaminha as demais requisições para o Gunicorn
    location / {
        proxy_pass http://sgn-django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # FORÇA O PROTOCOLO HTTPS (Essencial para DRF e Django Redirects)
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_redirect off;
    }
}
