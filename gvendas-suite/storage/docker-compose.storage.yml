services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    container_name: storage-nginx
    restart: always
    hostname: storage-server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      # FIX 1: Diz ao Traefik exatamente em qual rede procurar este container
      - "traefik.docker.network=net_proxy"
      
      - "traefik.http.routers.storage-nginx.rule=Host(`${STORAGE_DOMAIN:?storage.seu-dominio.com}`)"
      - "traefik.http.routers.storage-nginx.entrypoints=websecure"
      - "traefik.http.routers.storage-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.storage-nginx.loadbalancer.server.port=80"
      
      # --- MIDDLEWARE DE AUTENTICAÇÃO VIA DJANGO ---
      - "traefik.http.middlewares.auth-django.forwardauth.address=http://sgn-django:8000/api/user/validar-traefik/"
      - "traefik.http.middlewares.auth-django.forwardauth.trustForwardHeader=true"
      # FIX 2: Alterado para o nome da coluna que você usa (proprietario)
      - "traefik.http.middlewares.auth-django.forwardauth.authResponseHeaders=X-Empresa-Proprietario-Id"

      # --- APLICAÇÃO DOS MIDDLEWARES ---
      # FIX 3: Removi o error-pages-middleware temporariamente para teste, 
      # pois se ele capturar o 401 antes do navegador, o prompt não abre.
      - "traefik.http.routers.storage-nginx.middlewares=block-internal-header,auth-django"

    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
