services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    container_name: storage-nginx
    restart: always
    hostname: storage-server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage-nginx.rule=Host(`${STORAGE_DOMAIN:?storage.seu-dominio.com}`)"
      - "traefik.http.routers.storage-nginx.entrypoints=websecure"
      - "traefik.http.routers.storage-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.storage-nginx.loadbalancer.server.port=80"
      
      # --- MIDDLEWARE DE AUTENTICAÇÃO VIA DJANGO ---
      # 1. Define o ForwardAuth apontando para a sua função no Django
      - "traefik.http.middlewares.auth-django.forwardauth.address=http://sgn-django:8000/api/user/validar-traefik/"
      - "traefik.http.middlewares.auth-django.forwardauth.trustForwardHeader=true"
      # Copia headers de resposta do Django (como ID da empresa) para o Nginx usar
      - "traefik.http.middlewares.auth-django.forwardauth.authResponseHeaders=X-Empresa-Id"

      # --- APLICAÇÃO DOS MIDDLEWARES ---
      # Adicionei o 'auth-django' na lista. O Traefik processará na ordem escrita.
      - "traefik.http.routers.storage-nginx.middlewares=block-internal-header,auth-django,error-pages-middleware"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
