services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    container_name: storage
    restart: always
    hostname: storage
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    networks:
      - net_storage
    labels:
      - "traefik.enable=true"
      # FIX 1: Diz ao Traefik exatamente em qual rede procurar este container
      - "traefik.docker.network=net_storage"
      
      - "traefik.http.routers.storage.rule=Host(`${STORAGE_DOMAIN:?storage.seu-dominio.com}`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls.certresolver=letsencrypt"
      # MIDDLEWARE DE AUTENTICAÇÃO (Chama seu Django)
      - "traefik.http.routers.storage.middlewares=auth-django"

      # Configuração para o Traefik passar o header X-Empresa-Id de volta para o Nginx
      # Nota: Este middleware deve estar configurado no serviço do Django ou definido globalmente
      - "traefik.http.services.storage.loadbalancer.server.port=80"

    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
          
          