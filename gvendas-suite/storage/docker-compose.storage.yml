services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    container_name: storage-nginx
    restart: always
    hostname: storage-server
    volumes:
      # A VERDADE: Mapeie DIRETAMENTE sobre o default.conf para eliminar o arquivo da imagem
      - ../auth-nginx.conf:/etc/nginx/auth-nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    env_file:
      - path: ../.env
        required: true
      - path: .env
        required: false
    networks:
      - net_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage-nginx.rule=Host(`${STORAGE_DOMAIN:?storage.seu-dominio.com}`)"
      - "traefik.http.routers.storage-nginx.entrypoints=websecure"
      - "traefik.http.routers.storage-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.storage-nginx.loadbalancer.server.port=80"
      - "traefik.http.services.storage-nginx.loadbalancer.responseForwarding.flushInterval=100ms"
      # MIDDLEWARES
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.storage-nginx.middlewares=block-internal-header,error-pages-middleware"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
  