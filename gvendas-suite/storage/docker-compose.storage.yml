services:
  # STORAGE - Arquivos Privados
  storage:
    image: nginx:alpine
    # container_name: storage
    restart: always
    hostname: ${COMPOSE_PROJECT_NAME}-storage
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/storage:ro
    working_dir: /storage
    networks:
      - net_storage
    labels:
      - "traefik.enable=true"
      # FIX 1: Diz ao Traefik exatamente em qual rede procurar este container
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_storage"
      
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.rule=Host(`${STORAGE_DOMAIN:?storage.seu-dominio.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.tls.certresolver=letsencrypt"
      # MIDDLEWARE DE AUTENTICAÇÃO (Chama seu Django)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-storage.middlewares=${COMPOSE_PROJECT_NAME}-auth-django,${COMPOSE_PROJECT_NAME}-error-pages-middleware"

      # Configuração para o Traefik passar o header X-Empresa-Id de volta para o Nginx
      # Nota: Este middleware deve estar configurado no serviço do Django ou definido globalmente
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-storage.loadbalancer.server.port=80"

    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
          
          