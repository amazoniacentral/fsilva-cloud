server {
    listen 80;
    server_name localhost; # Altere para storage.francsilva.com.br, etc.
    # DNS interno do Docker
    resolver 127.0.0.11 valid=30s;
    # 1. IMPORTAÇÃO DOS MÉTODOS DE VALIDAÇÃO
    # O caminho deve ser relativo ao diretório /etc/nginx/ ou caminho absoluto.
    # Exemplo: se o arquivo está em /etc/nginx/conf.d/auth-nginx.conf
    include /etc/nginx/auth-nginx.conf;
    
    root /storage;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|csv|xml|xlsx|pdf|zip)$ {
        # FORÇA A VALIDAÇÃO AQUI TAMBÉM
        auth_request /validar-usuario;
        error_page 401 403 500 502 503 504 = @prompt_auth;

        # 3. BLOQUEIO TOTAL DE CACHE
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # 4. CORS RESTRITO
        add_header Access-Control-Allow-Origin "*" always;
        
        # 5. OTIMIZAÇÕES DE REDE
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # 6. SEGURANÇA MÁXIMA
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        # 7. BUSCA O ARQUIVO FÍSICO
        # root /usr/share/nginx/documentos/privados;
        try_files $uri =404;
    }
}
