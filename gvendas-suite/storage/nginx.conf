map $http_x_empresa_id $empresa_path {
    default "vazio";
    "~.+"    $http_x_empresa_id;
}

server {
    listen 80;
    server_name localhost;

    # Otimização para servir arquivos
    sendfile on;
    tcp_nopush on;
    
    # Configuração de charset para nomes de arquivos com acento
    charset utf-8;

    location / {
        # O Nginx define a raiz como a pasta do ID da empresa
        # Se o ID for 51, o Nginx lê /storage/51/
        root /storage;  # /empresa/$empresa_path;

        # Ativa a listagem visual de arquivos
        #autoindex on;
       # autoindex_exact_size off;
       # autoindex_localtime on;
       
        fancyindex on;
        fancyindex_exact_size off;
        fancyindex_name_length 255; # Não corta nomes longos
        fancyindex_localtime on;
        
        # Estilo visual (o tema 'light' ou 'dark' depende da imagem)
        #fancyindex_header "/.fancyindex/header.html";
       # fancyindex_footer "/.fancyindex/footer.html";
        #fancyindex_ignore ".fancyindex"; # Esconde a pasta do tema do cliente
        
        # Garante que o navegador tente abrir imagens e PDFs em vez de baixar
        add_header Content-Disposition "inline";
        
        # Segurança: impede que o usuário tente subir diretórios (../)
        if ($request_uri ~* "\.\./") {
            return 403;
        }

        # Tenta servir o arquivo; se não existir a pasta ou arquivo, 404
        try_files $uri $uri/ =404;
    }

}
