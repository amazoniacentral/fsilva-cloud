<!DOCTYPE html>
<html>
<head>
    <title>Arquivos - {{.Name}}</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f8f9fa; }
        .box { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; color: #333; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #666; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f1f1f1; }
        a { text-decoration: none; color: #007bff; font-weight: 500; }
        .meta { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Arquivos da Empresa</h1>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tamanho</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody>
                {{if .CanGoUp}}
                <tr>
                    <td><a href="..">⬅️ Voltar</a></td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                {{end}}
                {{range .Items}}
                <tr>
                    <td>
                        <a href="{{urlquery .Name}}{{if .IsDir}}/{{end}}">
                            {{if .IsDir}}📁{{else}}📄{{end}} {{.Name}}
                        </a>
                    </td>
                    <td class="meta">{{if .IsDir}}-{{else}}{{.Size}} bytes{{end}}</td>
                    <td class="meta">{{.ModTime.Format "02/01/2006 15:04"}}</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
