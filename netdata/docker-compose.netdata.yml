services:
  netdata:
    image: netdata/netdata:latest
    # container_name: netdata
    restart: always
    hostname: ${COMPOSE_PROJECT_NAME}-monitoramento
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 100M
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net_data
    env_file:
      - .env
    environment:
      - NETDATA_CHECK_FOR_UPDATES=yes
    labels:
      - "traefik.enable=true"
      # Roteador e Domínio
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-netdata.rule=Host(`${DOMAIN:?netdata.seu-domonio.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-netdata.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-netdata.tls.certresolver=letsencrypt"
      
      # Vinculação ao Serviço
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-netdata.service=netdata-service"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-netdata-service.loadbalancer.server.port=19999"
      
      # SEGURANÇA: Aplica a autenticação básica que você já usa no Traefik
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-netdata.middlewares=auth-painel@docker"
