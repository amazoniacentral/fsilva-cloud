# /proxy/traefik/cloudflare/docker-compose.yml
services:
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    env_file: 
      - .env
    environment:
      - DOCKER_API_VERSION=1.40
    hostname: traefik-edge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - default
      - net_proxy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    expose:
      - "8080"
    labels:
      - "traefik.enable=${TRAEFIK_DASHBOARD_ENABLE:-false}"
      # Cria o middleware puxando a credencial do .env
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH}"
      # Rota sem domínio (aceita qualquer IP na porta 8080)
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=traefik"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_API_KEY=${CF_API_KEY}
      # Se preferir usar Token em vez de Global Key, comente as duas de cima e descomente a linha abaixo:
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      # =====================
      # API / DASHBOARD (Ativado via labels, mantendo apenas o entrypoint)
      # =====================
      - "--entrypoints.traefik.address=:8080"
    
      # =====================
      # ENTRYPOINTS HTTP/HTTPS
      # =====================
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    
      - "--entrypoints.websecure.address=:443"
    
      # =====================
      # LOGS
      # =====================
      - "--log.level=INFO"
      - "--accesslog=true"
    
      # =====================
      # PROVIDERS
      # =====================
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
    
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    
      # =====================
      # TLS / LET'S ENCRYPT (DNS CHALLENGE - CLOUDFLARE)
      # =====================
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    
      # =====================
      # MÉTRICAS
      # =====================
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamics:/etc/traefik/dynamic
      - traefik_acme:/etc/traefik/acme
    working_dir: /etc/traefik/dynamic

networks:
  default:
  net_proxy:

volumes:
  traefik_dynamics:
  traefik_acme:
  
include:
  - ../errors/docker-compose.yml
  - ../services/docker-compose.servives.yml
