services:
  traefik:
    image: traefik:v3.0
    # container_name: traefik
    restart: always
    env_file: 
      - .env
    hostname: ${COMPOSE_PROJECT_NAME}-traefik-edge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      web:
      net_proxy:
        aliases:
          - traefik-internal
      net_data:
    ports:
      - 80:80
      - 443:443
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    command:
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # LIGA OS LOGS DE ACESSO (Necessário para os gráficos de requisições)
      - "--accesslog=true"
      # HABILITA O SISTEMA DE MÉTRICAS INTERNAS
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # CONFIGURAÇÕES DE PROVIDERS
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"


    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamics:/etc/traefik/dynamic
      - ../proxy/certificados:/etc/traefik/acme
      - ../proxy/.htpasswd:/etc/traefik/dynamic/.htpasswd:ro
    working_dir: /etc/traefik/dynamic
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-traefik-dashboard.rule=Host(`${DOMAIN:?proxy.seu-dominio.com}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-traefik-dashboard.service=api@internal"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-auth-painel.basicauth.usersfile=/etc/traefik/dynamic/.htpasswd"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-traefik-dashboard.middlewares=auth-painel"
      
  error-handler:
    image: nginx:alpine
    # container_name: global-error-server
    restart: always
    hostname: ${COMPOSE_PROJECT_NAME}-pagina-erros
    networks:
      - net_proxy
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../proxy/errors:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}-net_proxy"
      
      # SERVIÇO
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-error-service.loadbalancer.server.port=80"
      
      # MIDDLEWARE
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-error-pages-middleware.errors.status=400-599"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-error-pages-middleware.errors.service=error-service"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-error-pages-middleware.errors.query=/{status}.html"

      # ROTEADOR HTTP CATCH-ALL
      # A sintaxe `{host:.+}` às vezes falha no V3. Use `HostRegexp(`^.+$`)`
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-http.rule=HostRegexp(`^.+$`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-http.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-http.middlewares=error-pages-middleware"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-http.service=error-service"

      # ROTEADOR HTTPS CATCH-ALL
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.rule=HostRegexp(`^.+$`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.middlewares=error-pages-middleware"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-catch-all-https.service=error-service"
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 32M



