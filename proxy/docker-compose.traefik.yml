services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    hostname: traefik-edge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - web
      - net_proxy
      - net_data
    ports:
      - 80:80
      - 443:443
    env_file: 
      .env
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    # environment:
    #   - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # LIGA OS LOGS DE ACESSO (Necessário para os gráficos de requisições)
      - "--accesslog=true"
      # HABILITA O SISTEMA DE MÉTRICAS INTERNAS
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # CONFIGURAÇÕES DE PROVIDERS
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../proxy/acme.json:/acme.json
      - ../proxy/dynamic:/dynamic:ro
      - dynamic:/dynamic
      - ../proxy/.htpasswd:/.htpasswd:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.middlewares.auth-painel.basicauth.usersfile=/.htpasswd"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-painel"
      
  error-handler:
    image: nginx:alpine
    container_name: global-error-server
    restart: always
    networks:
      - net_proxy
    volumes:
      # Sobrescreve a config padrão para evitar erros de host.docker.internal
      - ../proxy/error_nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mapeia as páginas HTML (404.html, 500.html, etc)
      - ../proxy/errors:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      # FORÇA O TRAEFIK A USAR A REDE CORRETA PARA ENCONTRAR O IP DESTE CONTAINER
      - "traefik.docker.network=net_proxy"
      
      # DEFINIÇÃO DO SERVIÇO DE ERRO
      - "traefik.http.services.error-service.loadbalancer.server.port=80"
      
      # DEFINIÇÃO DO MIDDLEWARE QUE INTERCEPTA OS STATUS CODES
      - "traefik.http.middlewares.error-pages-middleware.errors.status=400-599"
      - "traefik.http.middlewares.error-pages-middleware.errors.service=error-service"
      - "traefik.http.middlewares.error-pages-middleware.errors.query=/{status}.html"

      # ROTEADOR CATCH-ALL PARA HTTP (Prioridade 1 = Última instância)
      - "traefik.http.routers.catch-all-http.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.catch-all-http.entrypoints=web"
      - "traefik.http.routers.catch-all-http.priority=1"
      - "traefik.http.routers.catch-all-http.middlewares=error-pages-middleware"
      - "traefik.http.routers.catch-all-http.service=error-service"

      # ROTEADOR CATCH-ALL PARA HTTPS (Prioridade 1)
      # Nota: Usamos tls=true sem resolver para evitar falhas de validação de domínio inexistente
      - "traefik.http.routers.catch-all-https.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.catch-all-https.entrypoints=websecure"
      - "traefik.http.routers.catch-all-https.tls=true"
      - "traefik.http.routers.catch-all-https.priority=1"
      - "traefik.http.routers.catch-all-https.middlewares=error-pages-middleware"
      - "traefik.http.routers.catch-all-https.service=error-service"
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 32M



volumes:
  dynamic:

