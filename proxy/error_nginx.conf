server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Localização dos arquivos de erro
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Customização opcional para garantir que o Nginx não tente resolver nomes externos
    resolver 127.0.0.11; 

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
