server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # O segredo: Se o cara pedir /404.html, ele entrega. 
    # Se pedir qualquer outra coisa que não existe, ele força o status 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Garante que o Nginx não mude o status code para 200 ao entregar a página de erro
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
        internal;
    }
}
