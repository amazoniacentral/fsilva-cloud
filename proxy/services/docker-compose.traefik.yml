# /proxy/services/docker-compose.traefik.yml
services:
  gvendas:
    networks:
      - net_proxy

  django-nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
    
      # =========================
      # HTTP (porta 80)
      # =========================
      - "traefik.http.routers.nginx-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.service=django-nginx"
    
      # =========================
      # HTTPS (porta 443)
      # =========================
      - "traefik.http.routers.django-nginx.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.django-nginx.entrypoints=websecure"
      - "traefik.http.routers.django-nginx.tls=true"
      - "traefik.http.routers.django-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.django-nginx.service=django-nginx"
    
      - "traefik.http.services.django-nginx.loadbalancer.server.port=80"
      - "traefik.http.services.django-nginx.loadbalancer.responseForwarding.flushInterval=100ms"
    
      # =========================
      # Middleware
      # =========================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.django-nginx.middlewares=block-internal-header"

    networks:
      - net_proxy

  django:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
    
      # =========================
      # HTTP (80)
      # =========================
      - "traefik.http.routers.django-http.rule=Host(`django-internal.local`)"
      - "traefik.http.routers.django-http.entrypoints=web"
      - "traefik.http.routers.django-http.service=django"
    
      # =========================
      # HTTPS (443)
      # =========================
      - "traefik.http.routers.django.rule=Host(`django-internal.local`)"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.tls.certresolver=letsencrypt"
      - "traefik.http.routers.django.service=django"
    
      - "traefik.http.services.django.loadbalancer.server.port=8000"

    networks:
      - net_proxy

  django-celery-worker:
    networks:
      - net_proxy

  media:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
    
      # =========================
      # HTTP (80)
      # =========================
      - "traefik.http.routers.media-http.rule=Host(`${MEDIA_DOMAIN}`)"
      - "traefik.http.routers.media-http.entrypoints=web"
      - "traefik.http.routers.media-http.service=media"
    
      # =========================
      # HTTPS (443)
      # =========================
      - "traefik.http.routers.media.rule=Host(`${MEDIA_DOMAIN}`)"
      - "traefik.http.routers.media.entrypoints=websecure"
      - "traefik.http.routers.media.tls=true"
      - "traefik.http.routers.media.tls.certresolver=letsencrypt"
      - "traefik.http.routers.media.service=media"
    
      # =========================
      # SERVICE
      # =========================
      - "traefik.http.services.media.loadbalancer.server.port=80"
      - "traefik.http.services.media.loadbalancer.responseForwarding.flushInterval=100ms"
    
      # =========================
      # MIDDLEWARES
      # =========================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.media.middlewares=block-internal-header,error-pages-middleware"

    networks:
      - net_proxy

  storage:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
    
      # ======================
      # HTTP (80)
      # ======================
      - "traefik.http.routers.storage-http.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.storage-http.entrypoints=web"
      - "traefik.http.routers.storage-http.service=storage"
    
      # ======================
      # HTTPS (443)
      # ======================
      - "traefik.http.routers.storage.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls=true"
      - "traefik.http.routers.storage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.storage.service=storage"
    
      - "traefik.http.services.storage.loadbalancer.server.port=80"
    
      # ======================
      # HEADERS
      # ======================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.storage.middlewares=block-internal-header"

    networks:
      - net_proxy

networks:
  net_proxy:
    external: true
    
include:
  - ../../apps/docker-compose.yml
  - ../../database/docker-compose.yml
