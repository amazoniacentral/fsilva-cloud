
services:
  gvendas:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_GVENDAS:-3000}:80"
    networks:
      - web_ssh
  django:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_DJANGO:-8000}:8000"
    networks:
      - web_ssh
  nginx:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_NGINX:-8001}:80"
    networks:
      - web_ssh
  media:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_MEDIA:-8002}:80"
    networks:
      - web_ssh
  storage:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_STORAGE:-8003}:80"
    networks:
      - web_ssh
  netdata:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_NETDATA:-19999}:19999"
    networks:
      - web_ssh
