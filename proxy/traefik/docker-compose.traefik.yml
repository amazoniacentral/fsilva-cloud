services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    container_name: traefik
    env_file: 
      - .env
    hostname: traefik-edge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - net_proxy
      - web
    ports:
      - 80:80
      - 443:443
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    command:
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # LIGA OS LOGS DE ACESSO (Necessário para os gráficos de requisições)
      - "--accesslog=true"
      # HABILITA O SISTEMA DE MÉTRICAS INTERNAS
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # CONFIGURAÇÕES DE PROVIDERS
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamics:/etc/traefik/dynamic
      - ./certificados:/etc/traefik/acme
      - ./.htpasswd:/etc/traefik/dynamic/.htpasswd:ro
    working_dir: /etc/traefik/dynamic
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
      
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN:?proxy.seu-dominio.com}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.middlewares.auth-painel.basicauth.usersfile=/etc/traefik/dynamic/.htpasswd"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-painel"
      

