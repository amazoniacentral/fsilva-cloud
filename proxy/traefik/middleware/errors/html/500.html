<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Erro no Servidor - 500</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -5px;
            color: #000;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #333;
        }

        .error-description {
            font-size: 1rem;
            color: #666;
            max-width: 400px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-home {
            padding: 14px 40px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            background-color: #000;
            border: none;
            color: #fff;
            transition: opacity 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home:hover {
            opacity: 0.8;
            color: #fff;
        }

        footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #999;
            text-transform: uppercase;
        }

        /* Classe para esconder o botão via JS */
        .d-none {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container error-container">
        <div class="error-code">500</div>
        <h1 class="error-message">ERRO INTERNO</h1>
        <p class="error-description">
            Ocorreu um erro interno no servidor.
        </p>
        
        <a href="/" id="btn-home" class="btn-home">
            Voltar ao Início
        </a>
    </div>

    <footer>
        Fsilva Cloud @ <span id="current-year"></span>
    </footer>

    <script>
        // 1. Atualiza o ano automaticamente
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // 2. A VERDADE: Se o caminho for a raiz, remove o botão
        // Verificamos se o pathname é '/' ou vazio
        if (window.location.pathname === '/' || window.location.pathname === '') {
            document.getElementById('btn-home').classList.add('d-none');
        }
    </script>

</body>
</html>
