include:
  - ./docker-compose.traefik.yml
  
services:
  traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
    
      # =========================
      # HTTPS ONLY (RECOMENDADO)
      # =========================
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    
      # BASIC AUTH
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-painel"
      - "traefik.http.middlewares.auth-painel.basicauth.usersfile=/etc/traefik/.htpasswd"

  gvendas:
    networks:
      - net_proxy

  nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
    
      # =========================
      # HTTP (porta 80)
      # =========================
      - "traefik.http.routers.nginx-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.service=nginx"
    
      # =========================
      # HTTPS (porta 443)
      # =========================
      - "traefik.http.routers.nginx.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nginx.service=nginx"
    
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.http.services.nginx.loadbalancer.responseForwarding.flushInterval=100ms"
    
      # =========================
      # Middleware
      # =========================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.nginx.middlewares=block-internal-header"

    networks:
      - net_proxy

  django:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
    
      # =========================
      # HTTP (80)
      # =========================
      - "traefik.http.routers.django-api-http.rule=Host(`django-internal.local`)"
      - "traefik.http.routers.django-api-http.entrypoints=web"
      - "traefik.http.routers.django-api-http.service=django"
    
      # =========================
      # HTTPS (443)
      # =========================
      - "traefik.http.routers.django-api.rule=Host(`django-internal.local`)"
      - "traefik.http.routers.django-api.entrypoints=websecure"
      - "traefik.http.routers.django-api.tls=true"
      - "traefik.http.routers.django-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.django-api.service=django"
    
      - "traefik.http.services.django.loadbalancer.server.port=8000"

    networks:
      - net_proxy

  celery-worker:
    networks:
      - net_proxy

  media:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
    
      # =========================
      # HTTP (80)
      # =========================
      - "traefik.http.routers.media-nginx-http.rule=Host(`${MEDIA_DOMAIN}`)"
      - "traefik.http.routers.media-nginx-http.entrypoints=web"
      - "traefik.http.routers.media-nginx-http.service=media-nginx"
    
      # =========================
      # HTTPS (443)
      # =========================
      - "traefik.http.routers.media-nginx.rule=Host(`${MEDIA_DOMAIN}`)"
      - "traefik.http.routers.media-nginx.entrypoints=websecure"
      - "traefik.http.routers.media-nginx.tls=true"
      - "traefik.http.routers.media-nginx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.media-nginx.service=media-nginx"
    
      # =========================
      # SERVICE
      # =========================
      - "traefik.http.services.media-nginx.loadbalancer.server.port=80"
      - "traefik.http.services.media-nginx.loadbalancer.responseForwarding.flushInterval=100ms"
    
      # =========================
      # MIDDLEWARES
      # =========================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.media-nginx.middlewares=block-internal-header,error-pages-middleware"

    networks:
      - net_proxy

  storage:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_net_proxy"
    
      # ======================
      # HTTP (80)
      # ======================
      - "traefik.http.routers.nginx-http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.nginx-http.entrypoints=web"
      - "traefik.http.routers.nginx-http.service=nginx"
    
      # ======================
      # HTTPS (443)
      # ======================
      - "traefik.http.routers.nginx.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nginx.service=nginx"
    
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    
      # ======================
      # HEADERS
      # ======================
      - "traefik.http.middlewares.block-internal-header.headers.customrequestheaders.X-Internal-Secret="
      - "traefik.http.routers.nginx.middlewares=block-internal-header"

    networks:
      - net_proxy