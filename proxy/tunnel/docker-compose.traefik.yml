# /proxy/tunnel/docker-compose.traefik.yml
services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    hostname: traefik-edge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - net_proxy
      - default
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    expose:
      - "8080"
    command:
      # =====================
      # API / DASHBOARD
      # =====================
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--entrypoints.traefik.address=:8080"
    
      # =====================
      # ENTRYPOINTS HTTP (Vindo do Túnel)
      # =====================
      - "--entrypoints.web.address=:80"
    
      # =====================
      # LOGS
      # =====================
      - "--log.level=INFO"
      - "--accesslog=true"
    
      # =====================
      # PROVIDERS
      # =====================
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    
      # =====================
      # MÉTRICAS
      # =====================
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamics:/etc/traefik/dynamic
      - traefik_acme:/etc/traefik/acme
      - ../.htpasswd:/etc/traefik/.htpasswd:ro
    working_dir: /etc/traefik/dynamic

networks:
  net_proxy:
  default:

volumes:
  traefik_dynamics:
  traefik_acme:

include:
  - ../services/docker-compose.traefik.yml
