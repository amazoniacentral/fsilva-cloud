services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file: 
      - .env
    command: tunnel run
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - net_tunnel
      - web_tunnel
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
          
          
      
          
