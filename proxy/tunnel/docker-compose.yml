# /proxy/tunnel/docker-compose.cloudflare.yml
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file: 
      - .env
    command: tunnel run
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - net_tunnel
      - default
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M

networks:
  net_tunnel:
  default:
  
include:
  - ./docker-compose.traefik.yml
  - ../services/docker-compose.tunnel.yml