include:
  - ../prod/docker-compose.prod.yml

services:
  traefik:
    caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"

      
  nginx:
    ports:
      - "127.0.0.1:8001:80"
    env_file:
      - .env
    labels:
      - "traefik.http.routers.nginx.rule=Host(`${API_DOMAIN:?api.seu-dominio.com}`)"
    networks:
      - web
      - net_tunnel
  gvendas:
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - web
      - net_tunnel
  media:
    env_file:
      - .env
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - web
      - net_tunnel
  storage:
    env_file:
      - .env
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - web
      - net_tunnel
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  
  tunnel:
    env_file:
      - .env
