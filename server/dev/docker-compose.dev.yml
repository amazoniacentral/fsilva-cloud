
include:
  - ../../apps/docker-compose.apps.yml
  - ../../database/docker-compose.database.yml
  - ../../middleware/docker-compose.middleware.yml
  - ../docker-compose.server.yml
  - ./ssh.dev.yml

services:
  n8n:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_N8N:-5678}:5678"
  netdata:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_NETDATA:-2000}:19999"

  nginx:
    env_file:
      - .env
  gvendas:
    build: 
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
  media:
    env_file:
      - .env
  storage:
    env_file:
      - .env
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  whatsapp:
    env_file:
      - .env
  
      