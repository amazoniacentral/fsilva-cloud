
include:
  - ../../apps/docker-compose.apps.yml
  - ../../database/docker-compose.database.yml
  - ../../middleware/docker-compose.middleware.yml
  - ../docker-compose.server.yml

services:
  nginx:
    env_file:
      - .env
  gvendas:
    build: 
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
  media:
    env_file:
      - .env
  storage:
    env_file:
      - .env
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  whatsapp:
    env_file:
      - .env
  
  n8n:
    environment:
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      