# Serviço Auxiliar: Executa o chmod de forma isolada e desliga sozinho
services:
  init-permissions:
    image: alpine:latest
    user: "0:0"
    volumes:
      - pdf_docs_data:/data
    networks:
      - net_proxy
    command: >
      sh -c "chown -R 1000:1000 /data && chmod -R 777 /data"

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  traefik_dynamics:
  gvendas_data:
  storage_data:
  media_data:
  sgn_data:
  catalogos_pdf_compress_data:
  catalogos_pdf_data:
  catalogos_json_data:
  netdataconfig:
  netdatalib:
  netdatacache:
  whatsapp_sessions:
  whatsapp_logs:
  certificados_data:
  backups:
  n8n_data:
  pdf_docs_data:
  treinamento-ia:
    
networks:
  net_web_only:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"
  web_tunnel:
    driver: bridge
  web_host:
    driver: bridge
  web_traefik:
    driver: bridge
  net_proxy:
    driver: bridge
    # internal: true
  net_tunnel:
    driver: bridge
    internal: true
  net_boot:
    driver: bridge
    internal: true
  net_db:
    driver: bridge
    internal: true
  net_n8n:
    driver: bridge
    internal: true
