      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}
  media:
    env_file:
      - .env
  storage:
    env_file:
      - .env
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  whatsapp:
    env_file:
      - .env
  
  
