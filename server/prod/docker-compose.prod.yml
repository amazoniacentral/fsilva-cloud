# fsilva-cloud/docker-compose.yml
name: fsilva-cloud-prod

include:
  - ../../proxy/docker-compose.proxy.yml
  - ../../apps/docker-compose.apps.yml
  - ../../database/docker-compose.database.yml
  - ../../middleware/docker-compose.middleware.yml
  - ../docker-compose.server.yml
  
services:
  nginx:
    env_file:
      - .env
  gvendas:
    build: 
      args:
        - REACT_APP_API_DOMAIN=${API_DOMAIN:?api.seu-dominio.com}

  media:
    env_file:
      - .env
  storage:
    env_file:
      - .env
  django:
    env_file:
      - .env
  celery-worker:
    env_file:
      - .env
  celery-beat:
    env_file:
      - .env
  
  tunnel:
    env_file:
      - .env
      
      
