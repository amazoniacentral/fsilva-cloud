# /server/prod/docker-compose.yml
services:
  gvendas:
    environment:
      - API_DOMAIN=${API_DOMAIN}
  media:
    env_file:
      - path: .env
        required: false
  storage:
    env_file:
      - path: .env
        required: false
  django:
    env_file:
      - path: .env
        required: false
  django-celery-worker:
    env_file:
      - path: .env
        required: false
  django-celery-beat:
    env_file:
      - path: .env
        required: false
  whatsapp:
    env_file:
      - path: .env
        required: false
  
  n8n:
    environment:
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
