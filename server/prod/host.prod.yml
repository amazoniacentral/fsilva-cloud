      - "${HOST:-127.0.0.1}:${PORT_MEDIA:-8012}:80"
    networks:
      - web_host
  storage:
    ports:
      - "${HOST:-127.0.0.1}:${PORT_STORAGE:-8013}:80"
    networks:
      - web_host
