services:
  tunnel:
    image: cloudflare/cloudflared:latest
    # container_name: tunnel-prod
    restart: always # Produção não para nunca
    command: tunnel run
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - web
      - net_proxy
      - net_data
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 64M
    depends_on:
      - django